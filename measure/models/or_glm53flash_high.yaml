# GLM-5.3-Flash via OpenRouter (modal/fp8) at reasoning_effort: high.
#
# IDENTICAL TO `or_glm53flash.yaml` EXCEPT `reasoning_effort`. That file is the
# canonical record for this route — provider choice, the 404/429 map, the
# quantization picture and the temperature provenance are documented there and
# are NOT repeated here. Read it first, and change both files together.
#
# WHY THIS EXISTS. Every review verdict on the board was produced by GLM at
# `low`, and `low` on this model is near its floor: measured 2026-08-28, n=3,
# completion tokens for one one-line action.
#
#   nothing sent            1623 / 1838 / 2367   reasoning 6826-10044 chars
#   reasoning_effort high    195 /  233 /  256   reasoning  331- 637
#   reasoning_effort medium  101 /  108 /  139   reasoning    0- 136
#   reasoning_effort low      60 /  117 /  216   reasoning    0- 408
#
# THE DIAL IS LIVE, WHICH `or_glm53flash.yaml` RECORDED AS UNTESTED. Sending
# nothing produces ~20x the reasoning of `low`, so `low` was doing a great deal
# of work rather than being inert as feared. But low and medium are the SAME
# RUNG — their ranges overlap at n=3 — so `high` is the only setting that
# meaningfully moves this reviewer, and `medium` would have been a no-op.
#
# `reasoning.enabled: false` is a 400 here: "Reasoning is mandatory for this
# endpoint and cannot be disabled." There is no off switch on this route.
#
# TOP-LEVEL `reasoning_effort` IS HONOURED, which is what backend.py line 571
# sends, so this file needs no code change. That is NOT true of every route on
# this gateway — the Qwen3.8-Flash endpoint silently drops the same field. Same
# gateway, same field, different provider: measure, do not infer.
#
# TEMPERATURE is unchanged at 1.0 via the `glm-5.3-flash` key. Only the
# reasoning effort differs from the default file, so a difference between
# reviews is attributable to effort and nothing else.
#
# THE DEFAULT IS NOW `medium`, NOT `low` (2026-08-30). The table above was
# measured when it was low; the rungs it reports are unchanged, but the
# baseline this file is a step away from has moved. On the audit side high
# was rejected as a default the same day — 4.7x the wall clock and twelve
# finish_reason=length events against one. This file remains for the REVIEW
# role, where high is the only setting measured to move the reviewer.
llm_config:
  server: local
  model: "z-ai/glm-5.3-flash"
  vllm_url: https://openrouter.ai/api/v1
  api_key: OPENROUTER_API_KEY
  is_reasoning_model: true
  reasoning_effort: high
  extra_body:
    provider:
      order: ["modal/fp8"]
      allow_fallbacks: false
