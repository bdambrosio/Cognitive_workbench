# DeepSeek-V4-Flash-0731 on DeepInfra.
#
# REASONING IS `low` HERE AND THE PUBLISHER SAYS OTHERWISE. DeepSeek supports
# low / high / max and recommends the highest setting for demanding agentic
# workloads, with a 384K output budget at high or max. This model runs low
# anyway, for one run, because three untested providers and an untested
# max_tokens interaction is enough novelty for a first pass — and the
# truncation failure mode is SILENT. Raise it once the plumbing is proven.
#
# `max` is not reachable from here regardless: backend.py's allowlist is
# low|medium|high and would raise before the call.
#
# Publisher: temperature 1.0 with top_p 0.95 for agentic scenarios
# (top_p 1.0 otherwise).
# https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash-0731
llm_config:
  server: local
  model: "deepseek-ai/DeepSeek-V4-Flash-0731"
  vllm_url: https://api.deepinfra.com
  api_key: DEEPINFRA
  is_reasoning_model: true
  reasoning_effort: low

# TEMPERATURE 1.0 is the publisher's number, not the "agents want low
# temperature" heuristic. All three of this batch's publishers say 1.0 for
# agentic work, and the heuristic is what the earlier local-model work assumed.
# It is passed by the runner (--temperature), not set here, because
# llm_config is REPLACED wholesale and a value here would be silently lost
# for anything the runner does not carry.
#
# TOP_P IS A KNOWN DEVIATION. All three publishers say 0.95; react.py never
# passes top_p, so every call goes out at 1.0. Deliberate, not an oversight —
# plumbing it is a separate change and this batch is about the models.
