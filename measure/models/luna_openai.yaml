# gpt-5.6-luna — DIRECT to OpenAI, not through OpenRouter.
#
# The cloud reference model. Luna is already the campaign's pinned grader
# (measure/regrade.py GRADER), so this model asks the instrument to sit the
# exam it marks. That is deliberate and it is a KNOWN CONFOUND, not an
# oversight: a self-graded row is worth less than a cross-graded one, and
# this project has already measured how much less — self-grading inflated
# extraction by +62%. Read this model's score as an upper bound and say so
# wherever it appears in a table.
#
# WHY DIRECT, not OpenRouter. Every nemotron attempt died on OpenRouter 429s
# whose own metadata said limit_source: upstream_provider_shared_pool,
# is_byok: false. Our own OpenAI account has its own quota, so an audit at
# concurrency 1-2 is not competing with anyone.
#
# No expects_served_model: a cloud model has no /v1/models to interrogate and
# run.py records the declared id instead. `model` is therefore load-bearing
# here in a way it is not for a local model — get it wrong and the row is
# mislabelled with nothing to catch it.
llm_config:
  # _ChatBackend route 2: api_key set -> POSTs to
  # {vllm_url}/v1/chat/completions with an Authorization bearer, and skips
  # grammar / chat_template_kwargs (cloud rejects both).
  server: local
  model: "gpt-5.6-luna"
  # The trailing /v1 is stripped and re-appended at call time; this is
  # equivalent to bare https://api.openai.com. Kept in this spelling to match
  # scenarios/coord_search_luna.yaml, which is the config this model copies.
  vllm_url: https://api.openai.com/v1
  # NAME of the env var holding the bearer token, not the token.
  api_key: OPENAI_API_KEY
  is_reasoning_model: true
  # Chat Completions spelling — the nested reasoning.effort form in OpenAI's
  # docs is Responses-API shape and does not reach this path. Allowlist is
  # low|medium|high.
  #
  # low MATCHES the nemotron models and the coord_search_luna baseline, so the
  # campaign varies backend and not effort. It is also the honest setting for
  # cost: reasoning tokens are billed and not returned, so a higher effort
  # shows up as latency with nothing in the logs to account for it.
  reasoning_effort: low
