# GLM-5.3-Flash via OpenRouter (modal/fp8) at reasoning_effort: medium.
#
# IDENTICAL TO `or_glm53flash.yaml` EXCEPT `reasoning_effort`. That file is the
# canonical record for this route — provider choice, the endpoint map, the
# quantization picture and the temperature provenance are documented there and
# are NOT repeated here. Read it first, and change all three files together.
#
# WHY THIS EXISTS. The low and high arms on ChatterMate came out 20 min / 42
# claims / 1 finish-length event against 94 min / 79 claims / 12. Medium is the
# untested middle, and the only prior evidence that it might be a no-op is a
# 141-token one-line probe where low and medium overlapped at n=3. That probe
# has no cross-document work and no sustained attention, which is most of what
# an audit leg is, so it does not settle whether the rung is inert on this
# workload. Measured here instead of inferred.
#
# TEMPERATURE is unchanged at 1.0, resolving through the `glm-5.3-flash`
# substring key in src/chat/model_params.py. Only the reasoning effort differs
# from the other two files.
llm_config:
  server: local
  model: "z-ai/glm-5.3-flash"
  vllm_url: https://openrouter.ai/api/v1
  api_key: OPENROUTER_API_KEY
  is_reasoning_model: true
  reasoning_effort: medium
  extra_body:
    provider:
      order: ["modal/fp8"]
      allow_fallbacks: false
