# DeepSeek-V4-Flash-0731 served by Fireworks directly, added 2026-09-06.
#
# WHY. The 2026-08-26 survey found every provider of this model that accepts
# `response_format` slow (Baidu 69 tok/s the fastest) and the fast ones
# refusing it. Fireworks was not in that survey. Prescreened 2026-09-06 with
# the real payload (measure/provider_effort_grid.jsonl, 9 rows): schema-valid
# 9/9, 111-135 tok/s at low, 300-1,662 completion tokens for a one-line
# action across low/medium/high — five to ten times GLM's time per call,
# about twice Baidu's speed. Gate 3, a fixture run, is what this file is for.
#
# EFFORT `high`. DeepSeek recommends the highest setting for demanding
# agentic work (di_deepseek_v4flash.yaml quotes it), and in the prescreen
# high spent the fewest tokens of the three (300-855). `max` is not reachable:
# backend.py's allowlist is low|medium|high.
#
# QUANTIZATION UNKNOWN. Fireworks' model endpoint returned no card fields on
# 2026-09-06, so whether this is the fp8 artifact Baidu and DeepInfra serve
# is unverified; a comparison with those runs should say so.
#
# TEMPERATURE resolves through src/chat/model_params.py ("DeepSeek-V4-Flash"
# -> 1.0, the publisher's agentic value with top_p 0.95).
llm_config:
  server: local
  model: "accounts/fireworks/models/deepseek-v4-flash-0731"
  vllm_url: https://api.fireworks.ai/inference/v1
  # NAME of the env var holding the bearer token, not the token.
  api_key: FIREWORKS_API_KEY
  is_reasoning_model: true
  reasoning_effort: high
