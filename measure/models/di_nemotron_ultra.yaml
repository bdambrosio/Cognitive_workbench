# NVIDIA-Nemotron-3-Ultra-550B-A55B on DeepInfra. 550B total / 55B active,
# LatentMoE — Mamba-2 + MoE + attention hybrid.
#
# THIS MODEL HAS HISTORY. Six earlier attempts produced one valid run: two died
# on OpenRouter 429s from a shared upstream pool, one on a doubled /v1 in the
# base URL, twice on max_iters after spending eleven of twelve iterations
# reading documents so it could read the method, and once on a DeepInfra
# 300-second read timeout. Every one of those causes is now fixed or gone —
# the method arrives in the system prompt, the cap is 16, and the URL is bare.
#
# TEMPERATURE 1.0, not the 0.7 the retired model used. NVIDIA's own examples run
# this model at 1.0 / 0.95 and it is trained for persistent agentic work, so
# the earlier configuration was fighting the model's intended regime.
#
# Publisher: temperature 1, top_p 0.95; configurable reasoning budget.
# https://build.nvidia.com/nvidia/nemotron-3-ultra-550b-a55b
llm_config:
  server: local
  model: "nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B"
  vllm_url: https://api.deepinfra.com
  api_key: DEEPINFRA
  is_reasoning_model: true
  reasoning_effort: low

# TEMPERATURE 1.0 is the publisher's number, not the "agents want low
# temperature" heuristic. All three of this batch's publishers say 1.0 for
# agentic work, and the heuristic is what the earlier local-model work assumed.
# It is passed by the runner (--temperature), not set here, because
# llm_config is REPLACED wholesale and a value here would be silently lost
# for anything the runner does not carry.
#
# TOP_P IS A KNOWN DEVIATION. All three publishers say 0.95; react.py never
# passes top_p, so every call goes out at 1.0. Deliberate, not an oversight —
# plumbing it is a separate change and this batch is about the models.
