# Google Gemini 3.8 Flash via OpenRouter, pinned to Google AI Studio's
# standard endpoint, added 2026-09-24 for gate 3.
#
# FAILED PRE-SCREEN, UNQUALIFIED (Bruce, 2026-09-26). Gate 3 failed
# 2026-09-24: the model emits only the properties the action schema declares
# (thought, tool), so its actions carry no tool arguments. The model is in
# model_params.RETIRED, so this config no longer runs.
#
# NO DIRECT ROUTE: GOOGLE_API_KEY in ~/.bashrc is not a Gemini API key (the
# API answers "API key not valid"). OpenRouter serves the model only from
# Google (AI Studio, Vertex), so the pin keeps it on one endpoint. Standard
# tier $0.75 in / $3.75 out per M.
#
# EFFORT `low`, Bruce's choice 2026-09-24. Gates 1-2 (measure/prescreen.py,
# real action schema, n=3): low on AI Studio 3/3 valid, 76-110 completion
# tokens, 1.2-1.5 s; medium 3,082-15,834 tokens and 21-66 s per one-line
# action; nothing sent 1,678-15,857 and 13-70 s. Google recommends medium for
# agentic work, so this runs below the publisher's recommendation.
llm_config:
  server: local
  model: "google/gemini-3.8-flash"
  vllm_url: https://openrouter.ai/api/v1
  # NAME of the env var holding the bearer token, not the token.
  api_key: OPENROUTER_API_KEY
  is_reasoning_model: true
  reasoning_effort: low
  extra_body:
    provider:
      order: ["google-ai-studio"]
      allow_fallbacks: false
