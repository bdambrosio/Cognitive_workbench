# Known answers for the chhoto-url target (6a1b51c, v7.5.1), for scoring a run
# with measure/known_answers.py. Each answer was checked by hand against the
# target; `basis` says how. Two groups, marked by `selected`: `failure` answers
# (2026-09-24) are claims the runs of 2026-09-20..24 got wrong at least once, so
# they show whether a known failure came back and are not a rate; `sample`
# answers (2026-09-26) are a random draw from the reviewed surface, and only
# they read as a rate; `tier-sample` answers (2026-09-26) are a random draw
# across tiers, scored on the tier alone. Tiers on `sample` and `tier-sample`
# answers were rated blind (TIERS.md, thresholds and reliance statement only, no
# surface tier in view) and then adjudicated. The `failure` answers were reviewed by Bruce on
# 2026-09-26: no-personal-info-logged accepts two verdicts because the claim
# does not say what counts as personal information; compose-up was dropped (its
# text says to modify the file first).
#
# Fields:
#   source, lines   where the claim is made; a frozen claim whose own quote
#                   overlaps these lines is a candidate
#   statement       what the claim says; among several candidates the one whose
#                   statement is closest (the duplicates pass's embedder) is taken
#   verdict         when the claim was tested, the verdicts that are right; two
#                   verdicts only where the claim itself can be read two ways
#   cites_any       when the claim was tested, the finding must cite at least
#                   one of these line ranges; this is how a right verdict for a
#                   wrong reason is told apart
#   tier            the tiers that are right for the claim under this
#                   engagement's thresholds and chhoto-full's reliance
#                   statement (TIERS.md §4); two tiers only where the claim or
#                   the reliance statement can be read two ways
#   tier_basis      how the tier was decided, where the answer also has a verdict
#   selected        `failure`, `sample` or `tier-sample`, as above
target: chhoto-url 6a1b51c
answers:
  - id: hit-only
    selected: failure
    source: README.md
    lines: [66, 67]
    statement: Only the hit is recorded for each visit to a short link, and nothing else about the visitor.
    verdict: [real, real_with_caveat]
    basis: >
      Hits are counted per link. As shipped nothing else about a visitor is
      written: the default log filter (backend/src/main.rs:45-52,
      "warn,chhoto_url=info,...") drops actix-web's info-level access log, so
      raising RUST_LOG is an operator setting and at most a caveat (METHOD §2,
      as shipped). The enumeration of 2026-09-24 (cmp-chhoto-glm-med) lost this
      claim to a wrong `restates` pointer.

  - id: no-personal-info-logged
    selected: failure
    source: docs/INSTALLATION.md
    lines: [279, 279]
    statement: No personal information of the end user is ever logged.
    verdict: [contradicted, real_with_caveat]
    cites_any:
      - {document: backend/src/database/events.rs, lines: [258, 263]}
    basis: >
      When adding a link fails, backend/src/database/events.rs:258-263 logs the
      submitted long URL and shortlink at ERROR, which the default filter
      passes. Not the actix access log: that is dropped by the default filter,
      so a finding resting on it alone is right for the wrong reason
      (cmp-chhoto-glm-med INSTALLATION #101). real_with_caveat is also right:
      the line is written only when saving a new link fails, and a submitted URL
      is personal information only when it happens to contain some.

  - id: no-cookies
    selected: failure
    source: README.md
    lines: [98, 99]
    statement: The software sets no cookies.
    verdict: [contradicted]
    cites_any:
      - {document: backend/src/main.rs, lines: [104, 112]}
    basis: >
      backend/src/main.rs:104-112 wraps the app in actix-session's
      SessionMiddleware with CookieSessionStore and a persistent session; the
      admin login writes a token into it (backend/src/services/post.rs:221). The
      cookie is set only for the admin after login; visitors to short links get
      none. METHOD §2 reads a claim in its ordinary sense and a boundary claim
      against the software as shipped, and §8 makes the excluded thing active as
      shipped `contradicted`. Reading "cookies" as tracking cookies only,
      because the list calls them anti-user, narrows the claim beyond its words;
      the context bears on materiality, not on the verdict.

  - id: no-tracking
    selected: failure
    source: README.md
    lines: [94, 94]
    statement: The software performs no tracking or spying of any kind.
    verdict: [real_with_caveat]
    basis: >
      The backend has no HTTP client and sends nothing out. The shipped frontend
      (frontend/index.html:50-60) loads scripts and fonts from cdn.jsdelivr.net
      and Google Fonts, which exposes each visitor's IP to those hosts, and the
      session cookie is set on admin login. Caveats, not tracking by the
      software. backend/Cargo.toml lists no HTTP client crate (checked
      2026-09-26).

  - id: compose-basic-deployment
    selected: failure
    source: docs/INSTALLATION.md
    lines: [8, 9]
    statement: The sample compose file contains everything needed for a basic deployment.
    verdict: [contradicted, partial]
    cites_any:
      - {document: deploy/compose.yaml, lines: [35, 35]}
      - {document: deploy/compose.yaml, lines: [106, 117]}
    basis: >
      By reading: the service mounts a volume `data` (line 107) and the file
      declares only `db` (116-117), so the file cannot be used as shipped. Line
      35 ("- CHHOTO_SQLITE_USE_WAL_MODE = True") also fails: the spaces around
      `=` put a trailing space in the variable name. That was found on
      2026-09-24 by running `docker compose config -q` (Docker Compose v5.0.2)
      on the shipped file, which is no longer done: seller files are not
      executed, not even compose config.

  # --- selected: sample. A random draw (Python random.seed(20260926)) of 20 of
  # the 32 tier-1 claims on chhoto-full's reviewed surface that no answer above
  # covers. Each was answered from the target by an agent that opened no run's
  # finding, then every cited line was checked against the target by Claude on
  # 2026-09-26; the bases below are the checked versions. Bruce's review is
  # pending.
  - id: readme-mit-licence
    selected: sample
    source: README.md
    lines: [12, 12]
    statement: The target is licensed under the MIT licence.
    verdict: [real]
    tier: [1]
    basis: >
      The claim is about a document (the licence), so METHOD §7 (a claim about a
      document is settled by the document) decides it. Verified: LICENSE:1 reads
      "MIT License", and LICENSE:3-21 is the standard MIT permission and
      warranty text ("Permission is hereby granted, free of charge, to any
      person obtaining a copy ..."), with "Copyright (c) 2023-2026 Sayantan
      Santra". The package manifest agrees: backend/Cargo.toml:9 `license =
      "mit"`, and source files carry "SPDX-License-Identifier: MIT" (for example
      backend/src/services/get.rs:2). No other licence file was found in the
      target root. Per §7, this settles that the file is the MIT licence, not
      any legal question about distribution.
    tier_basis: >
      Step 1: the claim is about a document, but the badge line is a notice that
      states the licence of the code, so under §4's document rule it has a
      route; the stated threshold "a licence or ownership problem with the code"
      names the kind of failure it could have, and the depends item "The MIT
      licence and clean ownership of the code" also reaches it. Step 4: it could
      be untrue by the code being under a different licence, under a more
      restrictive or copyleft licence, under no licence at all, or under mixed
      licences with parts not MIT. Step 5: any of these is a licence problem
      with the code, which the buyer says ends the deal; there is no other way
      the seller's documents describe that meets the plan, and the reliance item
      says there is no repair the buyer could make itself. Rated against the
      buyer's stated threshold: "a licence or ownership problem with the code".

  - id: selfhosted-url-shortener
    selected: sample
    source: README.md
    lines: [20, 20]
    statement: The product is a self-hosted URL shortener — the core function of the category exists.
    verdict: [real]
    tier: [1]
    basis: >
      METHOD §2 reads a category claim as one claim: that the core function of
      the category exists. Verified in source: a create path,
      `#[post("/api/new")]` at backend/src/services/post.rs:29-30, which calls
      `utils::add_links_helper` (post.rs:34) to store a long link under a short
      link (backend/src/database/queries.rs:25-28, `INSERT INTO urls (long_url,
      short_url, hits, expiry_time, notes)`); and a resolve path,
      `#[get("/{shortlink}")]` at backend/src/services/get.rs:124, which looks
      up the long URL (get.rs:130-131) and redirects to it (get.rs:133-137).
      Self-hosted: the target ships its own server (`HttpServer::new` at
      backend/src/main.rs:97) and deployment files (deploy/compose.yaml,
      deploy/Containerfile*, deploy/helm-chart/). I inferred, and did not check,
      that nothing depends on a hosted service of the seller to run.
    tier_basis: >
      Step 1: the claim asserts two things; "URL shortener" falls under the
      depends items for shortening and for resolving short links (the buyer said
      "a small, private link shortener"), and "selfhosted" is reached by the
      stated threshold "a dependency the buyer cannot run on its own hardware"
      and by the depends item for self-hosting. Step 4: it could be untrue
      because the shortening function is absent, because the product exists but
      is not a URL shortener in use, or because it cannot be run on the buyer's
      own hardware without a hosted dependency. Step 5: absence of shortening
      leaves nothing the buyer is buying, and the reliance statement says staff
      cannot patch that at acceptable cost; a hosted dependency triggers the
      buyer's end-the-deal condition; neither leaves the plan holding, so the
      claim is tier 1. Rated against the buyer's stated threshold: "a dependency
      the buyer cannot run on its own hardware".

  - id: readme-hit-counting
    selected: sample
    source: README.md
    lines: [39, 39]
    statement: The software includes hit counting as one of its features.
    verdict: [real]
    tier: [1]
    basis: >
      An existence claim, settled by citation per METHOD §6. Verified: the
      redirect handler calls `database::find_and_add_hit`
      (backend/src/services/get.rs:131), which after resolving the link sends
      the short link to a hit queue: `hits_tx.send((shortlink.to_owned(),
      false))` (backend/src/database/events.rs:161). A background worker,
      started at backend/src/main.rs:91-92, counts pending hits per link
      (backend/src/background.rs:27) and writes them with the ADD_HIT statement
      `SET hits = hits + :count` (backend/src/database/queries.rs:20-23), into
      the `hits INTEGER NOT NULL` column of the urls table (queries.rs:42). Hits
      are returned with each link by the list queries (queries.rs:105-106).
    tier_basis: >
      Step 1: the claim falls under the depends item "Counting hits per short
      link", which the buyer's words support; no stated threshold reaches the
      absence of hit counting as the buyer wrote them, since the logging
      threshold names recording beyond the hit count, not the lack of a count.
      Step 4: it could be untrue because hit counting is absent, or because it
      is present and does not count hits as described. Step 5: the reliance
      statement says the buyer would lose the one piece of visitor data its
      price assumes and could not restore counting without fixing the code, and
      repair by the buyer is not a way the plan still holds; no other documented
      feature substitutes for it, so the failure is material. Rated on the
      buyer's plan as the buyer stated it.

  - id: shortening-mechanism
    selected: sample
    source: README.md
    lines: [58, 58]
    statement: The target contains a shortening path that accepts a submitted long URL and stores or returns a short link generated at random.
    verdict: [real]
    tier: [1]
    basis: >
      The frozen statement is the mechanism reading of README.md:58 ("Shortens
      URLs of any length to a randomly generated link"); the behaviour reading
      is claim 59, shortening-behaviour. Verified: POST /api/new
      (backend/src/services/post.rs:29-30) passes the body to add_links_helper;
      a request with no shortlink gets one from gen_link
      (backend/src/services/utils.rs:203-204 and 214-221), which picks a random
      adjective and name in the default Pair style (utils.rs:382-388;
      config.rs:292-294; deploy/compose.yaml:71) or a nanoid in the UID style
      (utils.rs:375-378); the link is stored by ADD_LINK
      (backend/src/database/queries.rs:25-28) and returned (post.rs:37-39).
      METHOD §6: real. "Of any length" is not in the frozen statement, so the
      request-body limit of actix-web's String extractor (256 kB by default,
      from dependency knowledge) is not part of this claim.
    tier_basis: >
      Step 1: the claim describes the running behaviour of shortening and falls
      under the depends item "Shortening a submitted long URL into a short link"
      (the buyer said "a small, private link shortener the buyer can run for its
      customers"); no stated threshold names this kind of failure. Step 4: it
      could be untrue because the running service returns no short link, returns
      a link that does not lead to the submitted URL, or returns links that are
      not randomly generated. Step 5: the first two defeat the core function the
      buyer is buying, which the reliance statement says staff cannot patch at
      acceptable cost; predictable links would let outsiders guess links on a
      service the buyer said is private, and doubt about the effect of that
      resolves to tier 1. Rated on the buyer's plan as the buyer stated it.

  - id: redirect-mechanism
    selected: sample
    source: README.md
    lines: [62, 63]
    statement: The target contains a redirect handler that resolves a short URL to its stored long URL and issues an HTTP redirect to it.
    verdict: [real]
    tier: [1]
    basis: >
      An existence claim, settled by citation per METHOD §6. Verified:
      `#[get("/{shortlink}")] pub(crate) async fn link_handler`
      (backend/src/services/get.rs:124-125), registered first at
      backend/src/main.rs:125, looks up the stored long URL with
      `database::find_and_add_hit` (get.rs:130-131), which runs FIND_LINK,
      `SELECT long_url FROM urls WHERE short_url = :short` for links that have
      not expired (backend/src/database/queries.rs:12-18). It then returns an
      HTTP redirect: `Either::Left(Redirect::to(longlink))` when a temporary
      redirect is configured, otherwise `Redirect::to(longlink).permanent()`
      (get.rs:133-137). The response is a redirect, not an intermediate page; an
      unknown or expired link gets a 404 page (get.rs:140-143). The code default
      is permanent (config.rs:198-199, TEMPORARY only when
      CHHOTO_REDIRECT_METHOD=TEMPORARY); the shipped deploy/compose.yaml:65 sets
      TEMPORARY. Either way the claim holds.
    tier_basis: >
      Step 1: the claim describes the running behaviour of resolving and falls
      under the depends item "Resolving a short link by redirecting the visitor
      straight to the destination" (the buyer said "a small, private link
      shortener the buyer can run for its customers"); no stated threshold names
      this kind of failure. Step 4: it could be untrue because the service does
      not redirect, redirects to the wrong destination, or redirects only for
      some links or some browsers. Step 5: each way means links the buyer's
      customers share fail or mislead their visitors, which the reliance
      statement says the buyer cannot repair, and no other documented path
      substitutes for the redirect, so the failure is material. Rated on the
      buyer's plan as the buyer stated it.

  - id: delete-list-need-admin-password
    selected: sample
    source: README.md
    lines: [77, 77]
    statement: Deleting or listing links requires admin access with the password.
    verdict: [real_with_caveat]
    cites_any:
      - {document: backend/src/auth.rs, lines: [115, 119]}
      - {document: backend/src/config.rs, lines: [221, 226]}
      - {document: backend/src/auth.rs, lines: [19, 27]}
      - {document: backend/src/services/delete.rs, lines: [42, 42]}
    tier: [1]
    basis: >
      Verified by reading. Deletion is the route at
      backend/src/services/delete.rs:35 (`#[delete("/api/del/{shortlink}")]`);
      it deletes only for `Auth::ValidAPIKey` (line 42) or `Auth::ValidSession`
      (line 76), and answers `Auth::None { result: _ } =>
      HttpResponse::Unauthorized().body("Not logged in!")` (line 93). Listing is
      `#[get("/api/all")]` at backend/src/services/get.rs:24; it returns
      Unauthorized for `Auth::None` (line 31) and `Auth::InvalidAPIKey` (line
      34), and lists only in the remaining (admin) cases (line 37). Neither
      handler checks public mode, so public mode does not open them. A session
      becomes valid only through POST /api/login, which compares the password
      (backend/src/services/post.rs:188-207). The shipped deployment files all
      set a placeholder password: deploy/compose.yaml:56 (`password=`, the
      legacy name, read through the fallback at backend/src/config.rs:41-51 and
      221), deploy/chhoto-url.container:28 (`Environment=CHHOTO_PASSWORD=`) and
      deploy/helm-chart/values.yaml:12 (`password:`, base64 of the word
      "password"). The values are the seller's public sample placeholders and
      are not quoted here. So as shipped the claim holds (METHOD §2, boundary
      read against default plus shipped deployment files). Two things a reader
      must know, each an operator setting, which §2 makes a caveat and not a
      contradiction: (1) with no password configured,
      backend/src/auth.rs:116-118 `if config.password.is_none() { return true;
      }` makes every request an admin session, and backend/src/config.rs:224-225
      logs "No password was provided. The API will be accessible to the public."
      — so anyone can delete and list; (2) when CHHOTO_API_KEY is set (commented
      out in all shipped deploy files, compose.yaml:61), a valid `X-API-Key`
      header also authorizes deletion and listing without the password
      (auth.rs:19-27, 168-170; delete.rs:42). Verdict real_with_caveat per §6.
      That these routes behave this way in a running instance is inferred from
      the code; nothing was run. cites_any accepts either caveat: the
      no-password path or the API-key path.
    tier_basis: >
      Step 1: the claim states an access control that is in place, so the stated
      threshold "a hardening step the README implies is on by default but is
      not" names the kind of failure it could have; it also falls under the
      depends item "Authentication and access control: ... admin-only listing
      and deletion" (the buyer said "a small, private link shortener"). Step 4:
      it could be untrue because listing needs no password, because deletion
      needs no password, or because a password is asked for but does not
      restrict access. Step 5: unauthenticated listing exposes every link the
      buyer's customers create on a service the buyer is paying to be private,
      and unauthenticated deletion lets anyone destroy them; the reliance
      statement says the only way round is the buyer fronting the service with
      its own gate, which is buyer engineering and not a way the plan holds, so
      the failure is material. Rated against the buyer's stated threshold: "a
      hardening step the README implies is on by default but is not".

