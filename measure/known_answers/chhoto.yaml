      second way, a hashed credential accepted and then checked wrongly, could
      leave the admin functions open, and the item's stated consequence is that
      the service would not be private, which is what the buyer said it is
      paying for. Whether that second way is a set-up defect or a failure of
      access control stays unclear, and doubt about the effect of a failure
      resolves to tier 1. Rated on the buyer's plan as the buyer stated it.
      Review: tier 2 only. The claim asserts an input form; its failure is met
      at setup and corrected without changing the code (§4 step 5, third
      bullet). A hashed check that admits a wrong credential would be a
      different claim.

  - id: custom-landing-page
    selected: tier-sample
    source: README.md
    lines: [75, 75]
    statement: The service can serve a custom landing page when configured to do so.
    tier: [2]
    basis: >
      Step 1: no stated threshold reaches this claim (it is not about logging,
      footprint, a hardening default, licence or a dependency). It falls under
      the reliance item "serving a custom landing page, disabling the frontend,
      and configuring Cache-Control headers", which the buyer uses; a uses item
      is not a route. Step 3: with no route the claim is not tier 1. Step 6: a
      person setting the software up who configures a landing page would act on
      this claim and would meet its failure in use, so §3's tier-2 test is met;
      on its own the failure changes nothing for the buyer, whose fallback under
      the item is the built-in interface. Rated on the practice's reading of the
      buyer's plan. Review: two tiers, 2 held. The landing-page item is `uses`,
      so there is no route; the ambiguity is whether a capability claim under a
      `uses` item meets §3's tier-2 test (a person setting the software up acts
      on it) or whether tier 2 is confined to documented details.
      Settled 2026-09-26 by Claude at Bruce's request: tier 2, a capability a person setting the software up acts on and meets the failure of, §3.

