      'middleware::Logger::default()', is wired but silent at the default
      filter: this is a derived fact from knowledge of the dependencies, per
      section 7, with the call at main.rs:99 and versions at
      backend/Cargo.lock:174-175 (actix-web 4.15.0) and Cargo.lock:766-767
      (env_logger 0.11.11): actix-web's Logger emits each request at info level
