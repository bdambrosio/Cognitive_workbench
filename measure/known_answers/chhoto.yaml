    tier: [1]
    basis: >
      A boundary claim of absence, so METHOD section 2 (read against the
      software as shipped: default behaviour plus the shipped deployment files;
      an operator setting that crosses the boundary is a caveat) and sections 6
      and 8 (two searches, every candidate opened) decide it. Two verdicts are
      listed because the claim itself can be read two ways; see the end of this
      basis. Lexical search (verified): grep -rnE
      '\b(trace|debug|info|warn|error)!\(' over backend/src excluding tests
      lists every log macro call (about 100 lines across main.rs, config.rs,
      auth.rs, background.rs, services/post.rs, services/delete.rs,
      services/utils.rs, database/utils.rs, database/events.rs); grep for
      RUST_LOG|env_logger|Logger|eprintln|println found
      backend/src/main.rs:45-70 (logger init), main.rs:75 and 78 (eprintln
      separators) and main.rs:99 '.wrap(middleware::Logger::default())'; grep
      -rniE 'log|RUST_LOG' over deploy found only the comment at
      deploy/compose.yaml:105 about TZ in logging, so no shipped deployment file
      sets RUST_LOG or a logging driver. Structural search (verified): opened
      every file under backend/src except tests, both frontend script files, and
      every deploy file. What is written as shipped: backend/src/main.rs:47-50
      takes RUST_LOG or the default
      '"warn,chhoto_url=info,actix_session::middleware=error"', and env_logger
      writes to stderr (main.rs:45-70 sets a format and calls .init(); no file
      target). At that filter the crate's own info and warn lines are written
      and its debug lines are not. Every info/warn/error line was read: none
      records a client address, user or session identity. The lines that mention
      a link are debug level (backend/src/database/events.rs:160
      'debug!("Accessed link: {shortlink}.")', events.rs:239-242 'debug!("Added
      link with shortlink: {}, longlink: {}, ...")', events.rs:311-314, 327) or
      error level on a failed insert (events.rs:255, 259-262), and the error
      lines carry the link, not who sent it. Login logs 'info!("Successful
      login.")' (services/post.rs:230, 247) and 'warn!("Failed login attempt!")'
      (post.rs:212, 237) with no identity, and under the claim's condition (no
