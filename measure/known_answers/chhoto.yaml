  - id: container-deployment
    selected: sample
    source: claim_sources/site_index_html.md
    lines: [61, 61]
    statement: The product is deployable as an OCI-compatible container, including via Docker and Podman.
    verdict: [real, real_with_caveat]
    tier: [1]
    basis: >
      Verified by reading the deployment files; nothing was run.
      deploy/Containerfile:4-30 is a multi-stage OCI build from the backend
      source ("FROM docker.io/lukemathwalker/cargo-chef:latest-rust-slim AS
      chef", "RUN cargo build --release --target=$target --locked --bin
      chhoto-url", "FROM scratch", "ENTRYPOINT [\"/chhoto-url\"]");
      Containerfile.alpine and Containerfile.scratch package prebuilt musl
      binaries for four architectures. Podman: deploy/chhoto-url.container is a
      Podman quadlet ("To be used with rootless quadlets",
      "Image=docker.io/sintan1729/chhoto-url:latest", "Volume=data:/data"), and
      Makefile:34-50 builds and runs with podman ("podman build --tag
      chhoto-url:debug -f deploy/Containerfile.debug ."). Docker:
      .github/workflows/test-and-release.yml:117-125 builds the image with
      docker buildx from deploy/Containerfile.alpine, and deploy/compose.yaml is
      a Docker Compose file. So the capability exists for Docker, Podman and
      plain OCI builds (METHOD §6, §7: deployment files show what a deployment
      is configured to be). Caveat a reader must know: the supplied compose.yaml
      mounts a named volume that it does not declare (107: "- data:/data";
      116-117: "volumes:" / " db:"), which Docker Compose rejects as an
      undefined volume, so that file does not start as shipped without a
      one-word edit. That Compose rejects it is from knowledge of the Compose
      file format, not from the materials; the mismatch itself is verified.
      Minor, also verified: compose.yaml:35 ("- CHHOTO_SQLITE_USE_WAL_MODE =
      True") has spaces around "=", so the variable name the program reads
      (config.rs:307 "CHHOTO_SQLITE_USE_WAL_MODE") is not the one set; the same
      line appears in chhoto-url.container:24. The compose and quadlet files
      pull a prebuilt image from docker.io that is not in the materials; the
      Containerfile shows it can be built from source instead. Two verdicts.
      Read as the capability to run under Docker, Podman or another OCI engine,
      which the Containerfiles, the quadlet and the Makefile show, real. Read as
      covering the shipped Docker workflow file, the compose sample's undeclared
      volume is something a reader must know, real_with_caveat.
    tier_basis: >
      Step 1: the threshold "a dependency the buyer cannot run on its own
      hardware" is about a dependency, and read no wider it does not name a
      failure of the product's own container packaging; the claim falls under
      the reliance item for self-hosting on the buyer's own hardware (the Docker
      and Podman images), which the buyer depends on, source the buyer's words.
      Step 4: the claim asserts several things and can be untrue by there being
      no runnable container at all, by Docker not running it, by Podman not
      running it, or by other OCI workflows not running it. Step 5: Docker alone
      or Podman alone failing is not material because the other documented
      engine still meets the plan, and other OCI workflows failing is not
      material for the same reason; no runnable container at all defeats the
      item, since rebuilding an image from the repository is engineering by the
      buyer and not a way the plan holds. Rated on the buyer's plan as the buyer
