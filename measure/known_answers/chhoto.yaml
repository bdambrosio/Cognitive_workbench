  - id: container-image-size
    selected: sample
    source: claim_sources/site_index_html.md
    lines: [11, 11]
    statement: The compressed container image is below 4.5 MB for the scratch variant and below 8.5 MB for the alpine variant.
    verdict: [unverifiable]
    tier: [1]
    basis: >
      Checked. deploy/Containerfile.scratch and deploy/Containerfile.alpine
      define images that copy a prebuilt binary from
      `./backend/target/<triple>/release/chhoto-url` plus `./frontend` onto
      `scratch` or `alpine` (Containerfile.alpine also runs `apk add --no-cache
      tzdata`). No built binary, no image, no registry manifest and no
      image-size record is in the materials: there is no backend/target
      directory, and .github/workflows/test-and-release.yml builds and pushes
      the images but records no size. backend/Cargo.toml:32-37 sets a
      size-oriented release profile (`lto = "fat"`, `strip = "symbols"`), which
      does not give a size. The README's "~6MB" is excluded documentation and a
      different figure; it is not evidence (METHOD §7). Lexical search for size
      and MB terms over deploy/, .github/, Makefile and backend/Cargo.toml, and
      structural inspection of the deploy/ directory; all candidates opened. A
      compressed image size is a measure of a built artefact that the materials
      do not contain (§7, evidence must reach the scope the claim states).
      unresolved_because: outside_the_materials (§8) — the kind of material that
      would settle it, a built image or registry manifest, was not supplied.
    tier_basis: >
      Step 1: the stated threshold "footprint or resource figures materially
      worse than stated" names the kind of failure a figure for compressed image
      size could have, and the depends item "The small resource footprint:
      compressed image sizes and RAM use" also reaches it. Step 4: the claim
      carries two figures and either could be untrue by a small margin or a
      large one; per §4 the margin taken is one large enough to reach the
      threshold, and either variant's figure can fail on its own. Step 5: at
      that margin the buyer's own price condition is breached; the reliance
      statement's only way round is bigger hardware, which the buyer may not
      regard as cheap, and doubt about the size of the failure resolves to tier
      1. Rated against the buyer's stated threshold: "footprint or resource
      figures materially worse than stated".

  - id: site-mit-licence
    selected: sample
    source: claim_sources/site_index_html.md
    lines: [13, 13]
    statement: The software is free and open source, released under the MIT licence.
    verdict: [real]
    tier: [1]
    basis: >
      Verified by reading. LICENSE:1 `MIT License`, and the rest of the file is
      the standard MIT permission text ("Permission is hereby granted, free of
      charge, to any person obtaining a copy ..."); backend/Cargo.toml:9
      `license = "mit"`; every source file carries `SPDX-License-Identifier:
      MIT` (a search for SPDX identifiers other than MIT over the target,
      excluding .git, returned nothing). The source is supplied, so it is open
      source; the MIT licence grants use free of charge. A licence is a
      provenance fact settled by the LICENSE file (METHOD §6 provenance, §7 "MIT
      licensed" is settled by the text of the LICENSE file; whether distribution
      is lawful is a legal question left alone).
    tier_basis: >
      Step 1: the stated threshold "a licence or ownership problem with the
      code" names the kind of failure this claim could have, and the depends
      item "The MIT licence and clean ownership of the code" also reaches it.
      Step 4: the claim asserts several things and could be untrue because the
      licence is not MIT, because the code is not open source (source available
      only, or parts withheld), or because it is not free of charge or of
      restriction. Step 5: each of these is a licence problem with the code,
      which the buyer says ends the deal; the reliance statement says there is
      no repair the buyer could make itself, so the failure is material. Rated
      against the buyer's stated threshold: "a licence or ownership problem with
      the code".

  - id: create-generated-or-custom-slug
    selected: sample
    source: claim_sources/site_index_html.md
    lines: [29, 29]
    statement: The target contains code that accepts a URL for shortening and creates a short link for it, using either an automatically generated slug or a user-chosen custom alias.
