  - id: no-auth-anyone-creates-deletes
    selected: tier-sample
    source: docs/CLI.md
    lines: [280, 281]
    statement: When authentication is disabled, anyone can create new links and delete old ones.
    tier: [3]
    basis: >
      Step 1: the claim describes what happens when authentication is switched
      off, so it falls under the authentication and access control item, which
      the buyer depends on; no stated threshold reaches it (the hardening
      threshold names a step implied to be on by default but not, and this claim
      states no default). Step 4: the claim can be untrue because disabling
      authentication does not in fact open link creation and deletion to anyone,
      or because it opens more than the claim says. Step 5: the buyer's plan as
      stated is a private service with authentication kept on, so neither way
      changes anything for the buyer; the state the claim describes is one the
      plan never enters, and there is no doubt about the effect to resolve
      upward. Step 6, §3 test: a person setting the software up would heed the
      warning but, keeping authentication on, would never meet its failure in
      use, so tier 3. Rated on the buyer's plan as the buyer stated it.

  - id: port-4567-published
    selected: tier-sample
    source: docs/INSTALLATION.md
    lines: [60, 60]
    statement: The target's container is configured to publish port 4567 to the host's port 4567.
    tier: [2]
    basis: >
      Step 1: the claim falls under the self-hosting item, which the buyer
      depends on and which names the service being reachable on its port, so it
      has a route; the threshold "a dependency the buyer cannot run on its own
      hardware" names a different kind of failure and does not reach a port
      mapping. Step 4: the claim can be untrue because the command maps a
      different port, or because the service listens inside the container on a
      port other than 4567 so the mapping reaches nothing. Step 5: either
      failure is one a person would notice while setting the software up and
      could correct by changing the port mapping, without changing the code, so
      it changes how the service is set up and not whether the plan holds; not
      material. Step 6, §3 test: a command's option that the person setting up
      acts on and meets the failure of in use, so tier 2. Rated on the buyer's
      plan as the buyer stated it.

  - id: redirect-method-variable
    selected: tier-sample
    source: docs/INSTALLATION.md
    lines: [161, 161]
    statement: The CHHOTO_REDIRECT_METHOD variable controls which redirection is used when a shortlink is resolved.
    tier: [2]
    basis: >
      Step 1: the claim falls under the resolving item, which the buyer depends
      on and which names the choice of temporary or permanent redirect; no
      stated threshold reaches it. Step 4: the claim can be untrue because the
      variable has another name (a setup failure a person would notice and
      correct without changing the code, not material), or because the variable
      is ignored and the redirect method is fixed, which removes the choice the
      reliance item names and cannot be corrected without changing the code.
      Step 5: whether losing that choice defeats a plan that depends on
      resolution is not settled by the reliance statement, which folds the
      choice into the depends item but describes the failure of the item as
      links failing or misleading; doubt about the effect of a failure resolves
      to tier 1. Rated on the buyer's plan as the buyer stated it. Review: two
      tiers, 2 held. The resolving item names the choice of redirect, so a route
      exists; its `if_it_failed` text is about resolution failing, and losing
      the choice leaves the default redirect working, which is why 2 is held.
      Settled 2026-09-26 by Claude at Bruce's request: tier 2, a documented configuration key; if it were ignored the default redirect still resolves, so the resolving item is not defeated, and §4 step 5's third bullet applies.

