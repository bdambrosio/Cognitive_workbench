  - id: container-image-size
    selected: sample
    source: claim_sources/site_index_html.md
    lines: [11, 11]
    statement: The compressed container image is below 4.5 MB for the scratch variant and below 8.5 MB for the alpine variant.
    verdict: [unverifiable]
    basis: >
      Checked. deploy/Containerfile.scratch and deploy/Containerfile.alpine
      define images that copy a prebuilt binary from
      `./backend/target/<triple>/release/chhoto-url` plus `./frontend` onto
      `scratch` or `alpine` (Containerfile.alpine also runs `apk add --no-cache
      tzdata`). No built binary, no image, no registry manifest and no
      image-size record is in the materials: there is no backend/target
      directory, and .github/workflows/test-and-release.yml builds and pushes
      the images but records no size. backend/Cargo.toml:32-37 sets a
      size-oriented release profile (`lto = "fat"`, `strip = "symbols"`), which
      does not give a size. The README's "~6MB" is excluded documentation and a
      different figure; it is not evidence (METHOD §7). Lexical search for size
      and MB terms over deploy/, .github/, Makefile and backend/Cargo.toml, and
      structural inspection of the deploy/ directory; all candidates opened. A
      compressed image size is a measure of a built artefact that the materials
      do not contain (§7, evidence must reach the scope the claim states).
      unresolved_because: outside_the_materials (§8) — the kind of material that
      would settle it, a built image or registry manifest, was not supplied.

  - id: site-mit-licence
    selected: sample
    source: claim_sources/site_index_html.md
    lines: [13, 13]
    statement: The software is free and open source, released under the MIT licence.
    verdict: [real]
    basis: >
      Verified by reading. LICENSE:1 `MIT License`, and the rest of the file is
      the standard MIT permission text ("Permission is hereby granted, free of
      charge, to any person obtaining a copy ..."); backend/Cargo.toml:9
      `license = "mit"`; every source file carries `SPDX-License-Identifier:
      MIT` (a search for SPDX identifiers other than MIT over the target,
      excluding .git, returned nothing). The source is supplied, so it is open
      source; the MIT licence grants use free of charge. A licence is a
      provenance fact settled by the LICENSE file (METHOD §6 provenance, §7 "MIT
      licensed" is settled by the text of the LICENSE file; whether distribution
      is lawful is a legal question left alone).

  - id: create-generated-or-custom-slug
    selected: sample
    source: claim_sources/site_index_html.md
    lines: [29, 29]
    statement: The target contains code that accepts a URL for shortening and creates a short link for it, using either an automatically generated slug or a user-chosen custom alias.
    verdict: [real]
    basis: >
      Verified by reading the code. backend/src/services/post.rs:29-30 registers
      the creation route ("#[post(\"/api/new\")]", "pub(crate) async fn
      add_links"), and main.rs:131 registers the service
      (".service(services::add_links)"). In backend/src/services/utils.rs the
      request struct carries an optional alias (26-31: "#[serde(default)]" /
      "pub(crate) shortlink: String"); add_links_helper splits requests by
      whether an alias was given (203-207: "} else if req.shortlink.is_empty()
      {" / "without_shortlinks.push((i, req));" / "with_shortlinks.push((i,
      req));"); a supplied alias is inserted as given (210: "for (i, res) in
      add_links(with_shortlinks, db, false).0 {"); an empty one is replaced by
      gen_link (214-220: "req.shortlink = gen_link("), which builds an
      adjective-name pair or a random UID (369-396). The insert is
      database/queries.rs:25-28 ("INSERT INTO urls" ... "VALUES (:long, :short,
      0, :expiry, :notes)"). The web UI form sends both fields
      (frontend/static/script.js:792-794: "longlink: longUrl.value," /
      "shortlink: shortUrl.value,"). Both parts of the claim exist in code;
      METHOD §6 real. Per §7 this shows the capability exists, which is what the
      statement asserts ("contains code that").

  - id: site-hit-counting
    selected: sample
    source: claim_sources/site_index_html.md
    lines: [37, 37]
    statement: The target contains code that records a hit each time a short link is used and keeps a per-link count.
    verdict: [real, real_with_caveat]
    basis: >
      Verified by reading the code. The redirect handler
      backend/src/services/get.rs:124-131 ("#[get(\"/{shortlink}\")]",
      "database::find_and_add_hit(shortlink_str, &data.reader, &data.hits_tx)")
      calls database/events.rs:142-165, which on a found, unexpired link
      enqueues a hit (161: "if let Err(err) =
      hits_tx.send((shortlink.to_owned(), false)).await {"). The worker in
      backend/src/background.rs:15-47 ("Run hit updates every 500ms or once 500
      distinct links are pending.") sums pending hits per link and calls
      database::add_hits (45), which runs database/queries.rs:20-23 ("UPDATE
      urls" / "SET hits = hits + :count"). The per-link column is queries.rs:42
      ("hits INTEGER NOT NULL"), and it is returned by /api/expand (post.rs:140
      "hits: chunks.hits,") and /api/all. The capability exists; METHOD §6. Two
      verdicts. Read as asserting that a per-link usage counter exists, real.
      Read as a promise that every use is counted, a reader must know that hits
      are held in memory and written in batches (background.rs:15-47, a 500 ms
      window) and that a batch whose commit fails is dropped
      (events.rs:185-191), which is real_with_caveat. Not partial: no evidence
      shows a count actually lost (METHOD §6, a gap must be citable).

  - id: container-deployment
    selected: sample
    source: claim_sources/site_index_html.md
    lines: [61, 61]
    statement: The product is deployable as an OCI-compatible container, including via Docker and Podman.
    verdict: [real, real_with_caveat]
    basis: >
      Verified by reading the deployment files; nothing was run.
      deploy/Containerfile:4-30 is a multi-stage OCI build from the backend
      source ("FROM docker.io/lukemathwalker/cargo-chef:latest-rust-slim AS
      chef", "RUN cargo build --release --target=$target --locked --bin
      chhoto-url", "FROM scratch", "ENTRYPOINT [\"/chhoto-url\"]");
      Containerfile.alpine and Containerfile.scratch package prebuilt musl
      binaries for four architectures. Podman: deploy/chhoto-url.container is a
      Podman quadlet ("To be used with rootless quadlets",
      "Image=docker.io/sintan1729/chhoto-url:latest", "Volume=data:/data"), and
      Makefile:34-50 builds and runs with podman ("podman build --tag
      chhoto-url:debug -f deploy/Containerfile.debug ."). Docker:
      .github/workflows/test-and-release.yml:117-125 builds the image with
      docker buildx from deploy/Containerfile.alpine, and deploy/compose.yaml is
      a Docker Compose file. So the capability exists for Docker, Podman and
      plain OCI builds (METHOD §6, §7: deployment files show what a deployment
      is configured to be). Caveat a reader must know: the supplied compose.yaml
      mounts a named volume that it does not declare (107: "- data:/data";
      116-117: "volumes:" / " db:"), which Docker Compose rejects as an
      undefined volume, so that file does not start as shipped without a
      one-word edit. That Compose rejects it is from knowledge of the Compose
      file format, not from the materials; the mismatch itself is verified.
      Minor, also verified: compose.yaml:35 ("- CHHOTO_SQLITE_USE_WAL_MODE =
      True") has spaces around "=", so the variable name the program reads
      (config.rs:307 "CHHOTO_SQLITE_USE_WAL_MODE") is not the one set; the same
      line appears in chhoto-url.container:24. The compose and quadlet files
      pull a prebuilt image from docker.io that is not in the materials; the
      Containerfile shows it can be built from source instead. Two verdicts.
      Read as the capability to run under Docker, Podman or another OCI engine,
      which the Containerfiles, the quadlet and the Makefile show, real. Read as
      covering the shipped Docker workflow file, the compose sample's undeclared
      volume is something a reader must know, real_with_caveat.

  - id: edit-links-and-metadata
    selected: sample
    source: claim_sources/site_index_html.md
    lines: [41, 41]
    statement: When an existing link is edited, the changes take effect and the link's stored details and metadata reflect them.
    verdict: [partial]
    cites_any:
      - {document: backend/src/database/queries.rs, lines: [91, 100]}
      - {document: backend/src/services/utils.rs, lines: [284, 293]}
    basis: >
      Verified by reading. The edit route is backend/src/services/put.rs:17-22,
      calling edit_link_helper (backend/src/services/utils.rs:257-302). Before
      the update, an empty note and an expiry of 0 are turned into no value:
      utils.rs:288-289, `chunks.expiry_time.filter(|&t| t > 0)` and
      `chunks.notes.filter(|s| !s.is_empty())`. The update is
      backend/src/database/queries.rs:91-100: `notes = COALESCE(:notes, notes)`
      and `expiry_time = COALESCE(:expiry, expiry_time)`, so no value keeps the
      old value. A note therefore cannot be cleared and an expiry cannot be
      removed. The shipped web UI sends exactly those values when the user
      empties the fields (frontend/static/script.js:891-903: the notes field as
      it is, `let expiry = 0` when the expiry field is empty) and then shows the
      cleared values locally (script.js:929-930), so the screen and the stored
      row disagree until the list is reloaded. The claim (site_index_html.md:41
      "Update existing links and manage their metadata"; statement "the changes
      take effect and the link's stored details and metadata reflect them")
      covers removing metadata, and the cited SQL shows that change does not
      take effect: a citable part not as claimed, so partial (METHOD §6,
      choosing between partial and real_with_caveat). Not contradicted: editing
      exists and other changes are stored. A finding of real misses a gap that
      the cited lines show.

  - id: installation-doc-mit-licence
    selected: sample
    source: docs/INSTALLATION.md
    lines: [2, 2]
    statement: The document is licensed under the MIT licence.
    verdict: [real]
    basis: >
      The statement is a provenance claim about the document: that it is
      MIT-licensed. LICENSE is not excluded: LICENSE:1 "MIT License", and
      LICENSE:5-6 grant rights to "this software and associated documentation
      files", which covers a documentation file in the repository. METHOD §7:
      "MIT licensed" is settled by the text of the LICENSE file. Real. The
      document's own SPDX line (docs/INSTALLATION.md:2, an HTML comment) cannot
      be read because the document is excluded, but the claim does not depend on
      it. Contrast tools-md-copyright-line, whose statement is about what the
      excluded document says.

  - id: oci-image-runs-on-oci-engines
    selected: sample
    source: docs/INSTALLATION.md
    lines: [32, 32]
    statement: The software is packaged as an OCI image whose configuration files, such as the compose.yaml and chhoto-url.container samples, support running it with OCI-compatible engines.
    verdict: [partial, real_with_caveat]
    cites_any:
      - {document: deploy/compose.yaml, lines: [106, 117]}
      - {document: deploy/compose.yaml, lines: [35, 35]}
    basis: >
      Verified by reading. The image definitions are standard container build
      files: deploy/Containerfile.scratch:4-5 "FROM scratch AS builder-amd64" /
      "COPY ./backend/target/x86_64-unknown-linux-musl/release/chhoto-url
      /chhoto-url" and :20 "ENTRYPOINT [\"/chhoto-url\"]" (a static musl binary
      in an empty base image); deploy/Containerfile.alpine is the other variant.
      The release workflow is configured to build and push them for four
      platforms: .github/workflows/test-and-release.yml:240 "file:
      deploy/Containerfile.scratch", :243 "platforms:
      linux/amd64,linux/arm64,linux/arm/v7,linux/riscv64" (configured, not shown
      to have run, METHOD §7). A podman quadlet sample exists:
      deploy/chhoto-url.container:14-15 "ContainerName=chhoto-url" /
      "Image=docker.io/sintan1729/chhoto-url:latest". The Makefile builds and
      runs the image with podman (Makefile:35 "podman build --tag
      chhoto-url:debug -f deploy/Containerfile.debug ."). The claim is hedged
      ("It should be possible"), and the materials bear out that the image is an
      ordinary OCI image with a fixed entrypoint and a quadlet sample. Caveat
      (verified by reading): the compose sample mounts a named volume that it
      does not declare: deploy/compose.yaml:107 "- data:/data" against :116-117
      "volumes:" / " db:". That Compose rejects an undeclared named volume is
      knowledge of the Compose specification, not something the materials state
      (inferred; no Compose version is cited, so METHOD §7's dependency rule
      does not strictly apply). Also compose.yaml:35 "-
      CHHOTO_SQLITE_USE_WAL_MODE = True" has spaces around "=", so the variable
      name the container receives is not the one the code reads (inferred from
      the list-form environment syntax). Two verdicts, because the quote
      (INSTALLATION.md:32) speaks of running the image on OCI engines while the
      frozen statement adds the sample files as members of the claim. Read with
      the samples as members, the compose sample as shipped is one member shown
      not to work: partial. Read as the hedged capability ("It should be
      possible"), the compose defects are what a reader must know:
      real_with_caveat. Either way the finding must cite the compose defect, so
      cites_any names it; real is one step lenient.

  - id: official-support-docker-podman
    selected: sample
    source: docs/INSTALLATION.md
    lines: [33, 34]
    statement: Official support is provided only for docker and podman.
    verdict: [unverifiable]
    basis: >
      The claim concerns the seller's support policy (about: seller, METHOD §5
      table). Searched the non-excluded materials for a support policy or
      agreement: .github/ISSUE_TEMPLATE/ (bug_report.md, feature_request.md,
      config.yml), .github/pull_request_template.md, docs/CONTRIBUTING.md,
      deploy/. The bug report template asks only for version, OS and browser;
      nothing states which engines are supported. The deploy files and Makefile
      show docker and podman usage (Makefile:35 podman build;
      deploy/chhoto-url.container for podman; a Helm chart under
      deploy/helm-chart also exists), which shows what the seller ships samples
      for, not what the seller officially supports. No support agreement or
      policy record was supplied. METHOD §8: unresolved_because
      outside_the_materials.

  - id: password-env-chhoto-password
    selected: sample
    source: docs/INSTALLATION.md
    lines: [62, 62]
    statement: The access password is configured through the CHHOTO_PASSWORD environment variable.
    verdict: [real, real_with_caveat]
    basis: >
      Verified. backend/src/config.rs:221 "let password =
      read_config_wrapper(\"CHHOTO_PASSWORD\", \"password\")" reads the variable
      (falling back to the legacy name "password", config.rs:41-51), and
      :224-225 warn "No password was provided. The API will be accessible to the
      public." when it is absent. The value is the access password:
      backend/src/services/post.rs:188 "let authorized = if let Some(password) =
      &config.password {" and :202 "Some(password == &req)" compare the login
      request against it (or verify an Argon2 hash, post.rs:193-196);
      backend/src/auth.rs:117 "if config.password.is_none() {" lets every
      session through when it is unset. Two verdicts. Read as a claim about the
      code's configuration interface, the whole claim holds: real. Read against
      the shipped deployment files, a reader must know that
      deploy/compose.yaml:56 sets the legacy name `password=` instead, which the
      code accepts through the fallback at config.rs:41-51: real_with_caveat.
      The second verdict was added on 2026-09-26 after reading the demo run's
      caveat, which is this one; it was judged on its merits.

  - id: data-mount-persistence
    selected: sample
    source: docs/INSTALLATION.md
    lines: [73, 73]
    statement: Database persistence is achieved by mounting a host directory into the container at /data.
    verdict: [real]
    basis: >
      Verified. The instruction block mounts ./data at /data and sets
      CHHOTO_DB_URL=/data/urls.sqlite (INSTALLATION.md:73-74, read for context
      only). The software opens the database at the configured path:
      backend/src/config.rs:55 "if let Some(db_url) =
      read_config_wrapper(\"CHHOTO_DB_URL\", \"db_url\")" returns that path, and
      backend/src/main.rs:83 "database::open_db(&conf.db_location, false)" opens
      it. Without the variable the default is also under /data: config.rs:64
      "let (legacy_location, new_location) = (\"/urls.sqlite\",
      \"/data/urls.sqlite\");", and :65-66 create the directory. So the database
      file lives in /data either way, and a host directory mounted there holds
      it. That a bind mount keeps files on the host is the container engine's
      behaviour (general knowledge, not from the materials). METHOD §6: the
      claim holds.

  - id: tools-md-copyright-line
    selected: sample
    source: docs/TOOLS.md
    lines: [1, 1]
    statement: This document states a copyright of 2023-2026 held by Sayantan Santra.
    verdict: [unverifiable, real]
    basis: >
      docs/TOOLS.md is excluded, so under METHOD §7 it shows only its existence,
      length and headings, and its line 1 is an HTML comment. The frozen
      statement, "This document states a copyright of 2023-2026 held by Sayantan
      Santra", is about what the document says: unverifiable, unresolved_because
      present_but_not_readable (§7, the paragraph on excluded documents). Two
      verdicts because the assertion the SPDX line makes is who holds the
      copyright, and read that way LICENSE:3 "Copyright (c) 2023-2026 Sayantan
      Santra" settles it: real. The enumeration's wording ("states") created the
      ambiguity; either reading follows METHOD. Contradicted or partial would be
      wrong on any reading.
