# nemotron-3-ultra via OpenRouter, fp8 or better.
#
# 550B total / 55B active MoE. $0.60/M prompt, $3.60/M completion.
#
# The quantization filter is not optional. Four providers serve this model at
# three quantizations, and the DEFAULT route lands on BaseTen — fp4, and the
# one provider with no `response_format` support, which is the missing
# parameter behind the 160 "unknown tool None" failures fixed in 96e03f54.
# Measured 2026-08-22: unpinned -> BaseTen, quantizations:[fp8] -> Venice,
# quantizations:[fp4] -> BaseTen as a control proving the filter bites.
#
# server: local + api_key takes _ChatBackend route 2 (bearer OpenAI-compat),
# NOT the legacy openrouter route, which hardcodes reasoning effort low on
# every call regardless of config.
llm_config:
  server: local
  model: "nvidia/nemotron-3-ultra-550b-a55b"
  vllm_url: https://openrouter.ai/api/v1
  api_key: OPENROUTER_API_KEY
  is_reasoning_model: true
  reasoning_effort: low
  extra_body:
    provider:
      quantizations: ["fp8"]
      allow_fallbacks: false
