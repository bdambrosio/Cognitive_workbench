# grok-4.6 on xAI, direct.
#
# PROBED BEFORE RUNNING, with the real react-shaped request (system + user +
# response_format=json_schema + max_tokens + temperature), not a hello-world.
# Three things the probe established that a docs read would not have:
#
#  - `response_format: json_schema` is accepted. The cloud branch of
#    backend.py sends it non-strict; xAI took it without a 400. This matters
#    more here than it looks: it is the constraint that stopped luna emitting
#    its ANSWER as JSON instead of an action (160 `unknown tool None`).
#  - `reasoning_effort` is a live dial, not inert. low cut reasoning tokens
#    521 -> 323 on an identical prompt. On Gemma the same field is binary and
#    the level does nothing, so this needed checking rather than assuming.
#  - 33 completion tokens for a one-line action, with reasoning on the
#    separate `reasoning_content` channel. That is the number that excluded
#    Qwen3.8-2.4T (2,902 tokens for the same shape of question) — this
#    architecture makes 35-187 calls per audit, so tokens per call is the
#    binding constraint, not parameter count.
#
# reasoning_effort: low MATCHES luna and both DeepInfra arms, so the campaign
# varies backend and not effort.
#
# No expects_served_model: a cloud arm has no /v1/models to interrogate that
# would prove which weights answered. `model` is load-bearing — get it wrong
# and the row is mislabelled with nothing to catch it.
#
# TWO KEYS EXIST, both valid: XAI_API_KEY and GROK_API_KEY, different values,
# both HTTP 200 against api.x.ai. This arm names XAI_API_KEY. If a quota
# question ever comes up, that ambiguity is where to look first.
llm_config:
  # _ChatBackend route 2: api_key set -> POSTs to
  # {vllm_url}/v1/chat/completions with an Authorization bearer, and skips
  # grammar / chat_template_kwargs (cloud rejects both).
  server: local
  model: "grok-4.6"
  # Trailing /v1 is stripped and re-appended at call time; spelled this way
  # to match luna_openai.yaml.
  vllm_url: https://api.x.ai/v1
  # NAME of the env var holding the bearer token, not the token.
  api_key: XAI_API_KEY
  is_reasoning_model: true
  reasoning_effort: low

# TEMPERATURE is left at the scenario default (0.7), not passed by the
# runner. xAI publishes no agentic recommendation to override it with, and
# 0.7 is the setting seven of the thirteen scored rows already ran at —
# including every Qwen row and luna wm1/wm2. The 1.0 on the DeepInfra arms is
# their publishers' number, not a house default.
