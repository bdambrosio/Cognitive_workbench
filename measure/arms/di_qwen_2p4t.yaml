# Qwen3.8-2.4T-A95B on DeepInfra. 2.4T total / 95B active MoE.
#
# THINKING CANNOT BE DISABLED on this model — the publisher is explicit that
# it reasons on every interaction regardless of configuration. So this arm has
# no reasoning variable to set, and `reasoning_effort` is omitted rather than
# set to a value the model will ignore. Verified on the wire: 38 output tokens
# to answer "ok", where a non-thinking model of this family spends 2.
#
# That is also why --max-tokens matters here more than for the others.
# Reasoning tokens bill against the same budget as the action, and DeepInfra's
# usage block reports reasoning_tokens as null, so a budget squeeze shows up
# as a truncated emission rather than as a number anyone can read.
#
# Publisher: temperature 1.0, top_p 0.95, top_k 20.
# https://huggingface.co/Qwen/Qwen3.8-2.4T-A95B
llm_config:
  server: local
  model: "Qwen/Qwen3.8-2.4T-A95B"
  vllm_url: https://api.deepinfra.com
  api_key: DEEPINFRA
  is_reasoning_model: true

# TEMPERATURE 1.0 is the publisher's number, not the "agents want low
# temperature" heuristic. All three of this batch's publishers say 1.0 for
# agentic work, and the heuristic is what the earlier local-arm work assumed.
# It is passed by the runner (--temperature), not set here, because
# llm_config is REPLACED wholesale and a value here would be silently lost
# for anything the runner does not carry.
#
# TOP_P IS A KNOWN DEVIATION. All three publishers say 0.95; react.py never
# passes top_p, so every call goes out at 1.0. Deliberate, not an oversight —
# plumbing it is a separate change and this batch is about the models.
