# Gemma-4-31B-it on the local vLLM. Zero marginal cost.
#
# expects_served_model is not optional for a local arm: model:"" means
# "whatever is served", so without the check this arm and qwen_local.yaml are
# the same file pointed at whatever the box happens to have loaded. On
# 2026-08-22 the box switched from Qwen to Gemma mid-campaign.
#
# NOTE: the live agent shares this server, so a local run contends with her
# and wall clock here is not comparable to a cloud arm's.
expects_served_model: "gemma-4-31B"

llm_config:
  server: local
  model: ""
  vllm_url: http://127.0.0.1:5000
  is_reasoning_model: false
