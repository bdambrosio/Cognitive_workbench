# INADMISSIBLE 2026-10-24 (Bruce): see docs/model-prescreen.md. Kept as a record;
# model_params.RETIRED makes a run naming this model fail with the reason.
#
# MiniMax-M3.1-Flash served by Fireworks directly, added 2026-10-23: open
# weights (about 428B total / 23B active, 1M context), released 2026-10-20.
#
# Prescreened 2026-10-23 with the real payload (measure/prescreen.py, direct
# URL): schema-valid 7/7; low 268-342 completion tokens in 2.1-2.4 s, medium
# 245-914 in 1.8-5.6 s; 123-163 tok/s.
#
# EFFORT `low`, for gate 3. The model card lists low / medium / high / xhigh /
# max and gives no default.
#
# PRICE $0.15 in / $0.015 cached / $0.60 out per M tokens (model page,
# 2026-10-23; not yet on the serverless pricing page).
#
# TEMPERATURE resolves through src/chat/model_params.py ("minimax-m3p1-flash"
# -> 1.0; publisher value, Bruce confirmed 2026-10-23).
llm_config:
  server: local
  model: "accounts/fireworks/models/minimax-m3p1-flash"
  vllm_url: https://api.fireworks.ai/inference/v1
  # NAME of the env var holding the bearer token, not the token.
  api_key: FIREWORKS_API_KEY
  is_reasoning_model: true
  reasoning_effort: low
