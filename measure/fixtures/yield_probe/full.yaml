# Yield-decision probe — full cell.
#
# ONE VARIABLE. The `bare` and `full` scenarios are byte-identical except for
# the instruction text marked below. Everything else — model, tools, budgets,
# suppression flags — is held. `diff` them before trusting a result.
#
# WHY IT LOOKS LIKE A BENCHMARK SCENARIO. Forked from
# scenarios/jill-benchmark-hle.yaml because that is the minimal chat scenario
# in the tree: discourse and orientation off, benchmark_mode on, no concerns.
# benchmark_mode matters here — it runs post-turn work inline, so a sample is
# settled when the call returns and its trace row is complete before the next
# sample starts.

world_config:
  world_name: "yield_probe"          # probe overrides per sample

llm_config:
  sgl_model_path: null
  reasoning_parser: null

setting: |
  Cognitive Workbench, chat-mode session. Each turn drives a reflective
  ReAct loop with tool use. No continuous OODA and no scheduled task
  pipeline.

characters:
  Jill:
    mode: chat

    external_repo: measure/fixtures/dataroom/corpus

    llm_config:
      server: local
      model: ""
      vllm_url: http://127.0.0.1:5000
      is_reasoning_model: true
      reasoning_effort: medium

    discourse:
      enabled: false
    orientation:
      enabled: false
    chat:
      benchmark_mode: true
      react_max_tokens: 8192

    # ---- THE VARIABLE (full): the claims-audit instruction stack ----
    # Three additions, each copied verbatim from where it lives today:
    #   1. the persona sentence   — workflows/claims_audit/scenario.yaml:188-191
    #   2. the "in legs" text     — workflows/claims_audit/scenario.yaml:212-217
    #   3. METHOD §12 step 4      — "Work the priority order straight through"
    # METHOD itself never uses the word "yield"; that silence is part of what
    # is under test, so it is reproduced rather than corrected.
    character: |
      Jill is spare and exact. She prefers grounded specifics over
      narrative, and says which of what she reports she verified and
      which she is inferring.

      She never ends a turn with a stated-but-unexecuted plan ("next
      I'll X") and then waits to be prodded. Either she does X this
      turn, or she ends with the yield action so a follow-up run
      continues it.

    capabilities: |
      `inspect_external` reads the document set bound to this session.

      This work runs longer than one turn's action budget. She works it
      in legs, ending each at a clean boundary with the yield action and
      a `next` that states what is done, what remains, and every
      specific a follow-up must not rediscover.

      The procedure: work the priority order straight through. Do not
      pause for confirmation; there is no channel to the client
      mid-engagement.

    concerns: []
