# claims-audit engagement: dataroom-fixture
#
# The synthetic FlowMetrics data room. Nine documents, planted defects, an
# answer key in measure/fixtures/dataroom/. Not a real business.
#
# WHAT THE ENGAGEMENT SUPPLIES, and the method must not invent: the target, and
# the claim sources named in brief.md (METHOD §12 step 1). Three models given
# the same nine documents enumerated 62, 67 and 273 claims before the sources
# were named per engagement.

target: measure/fixtures/dataroom/corpus

# THE CLAIM SOURCES, as data rather than as prose — brief.md says the same in
# words and must stay in step. §2 defines a claim as something the SELLER
# asserts, which makes doc3-doc8 evidence rather than claim sources.
claim_sources:
  - doc1_seller_listing_description.md
  - doc2_tech_stack_description_as_provided_by_se.md
  - doc9_seller_s_technical_claims_verbatim.md

# Runs land in runs/ beside this file. Retention is an engagement fact, not a
# harness default: a real client's run holds verbatim client material and
# carries a destruction date under the engagement letter (METHOD §14).
retention: keep — synthetic, no client material
