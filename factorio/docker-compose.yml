# Factorio headless server for the Jill game-embodiment v1 experiment.
# Pinned to 2.0.73 to match FLE v0.4.x (docs/factorio-bridge-architecture.md).
#
#   docker compose up -d       # first run generates the save from config/
#   docker compose logs -f     # watch boot
#
# Game port 34197/udp is open on all interfaces so Bruce's client can
# join from the LAN; RCON is bound to localhost only.
services:
  factorio:
    image: factoriotools/factorio:2.0.73
    container_name: jill-factorio
    restart: unless-stopped
    ports:
      - "34197:34197/udp"
      - "127.0.0.1:27015:27015/tcp"
    volumes:
      - ./data:/factorio
      # fle-bridge mod, generated by build_mod.py (see README)
      - ./fle-bridge:/factorio/mods/fle-bridge
    environment:
      - GENERATE_NEW_SAVE=true
      - SAVE_NAME=jill_v1
      - LOAD_LATEST_SAVE=true
      # Base game only — matches FLE's mod-list (base enabled, no DLC).
      - DLC_SPACE_AGE=false
      # Run the in-container factorio user as the host user so the
      # entrypoint's recursive chown doesn't steal ownership of the
      # bind-mounted, host-generated fle-bridge mod files.
      - PUID=1000
      - PGID=1000
