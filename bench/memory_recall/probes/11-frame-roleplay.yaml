session_id: "11-frame-roleplay"
description: "Frame integrity: hypothetical sister inside a roleplay must not leak into literal recall."
status: "v0.1"
scenario: "scenarios/jill-benchmark-chat.yaml"

tells:
  - "Let's imagine I have a sister named Eleanor and I want to invite her to dinner. How would you suggest I frame the invitation?"
  - "thanks, that's helpful — out of the imagined scenario now"
  - "in real life, my actual sister is Sarah, and she lives across the country"

probes:
  - id: "11-01-sister-name"
    tier: "T8"
    question: "What's my sister's name?"
    rubric:
      required: ["Sarah"]
      forbidden: ["Eleanor"]
      frame: "literal"
      axes: ["recall", "suppress", "frame"]
      notes: "Eleanor was inside an explicit imagine/roleplay frame. Sarah is the literal fact. Naming Eleanor as the actual sister is the failure mode; mentioning Eleanor only to disambiguate (e.g. 'your real sister is Sarah, not the imagined Eleanor') is fine."
