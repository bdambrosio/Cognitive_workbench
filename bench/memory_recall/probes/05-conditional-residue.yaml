session_id: "05-conditional-residue"
description: "Conditional retained as literal residue, separate from any commitment."
status: "v0.1"
scenario: "scenarios/jill-benchmark-chat.yaml"

tells:
  - "if the merger doesn't close by Friday we'll need to do another round of layoffs"
  - "the merger didn't close by Friday"

probes:
  - id: "05-01-conditional-recall"
    tier: "T2"
    question: "What did we say we'd do if the merger didn't close?"
    rubric:
      required: ["another round of layoffs"]
      forbidden: []
      frame: "literal"
      axes: ["recall"]
      notes: "Direct recall of the conditional clause."

  - id: "05-02-current-plan"
    tier: "T2"
    question: "Given the merger didn't close, what's our plan?"
    rubric:
      required: ["layoffs"]
      forbidden: []
      frame: "literal"
      axes: ["recall"]
      notes: "Apply the conditional to the now-true antecedent."
