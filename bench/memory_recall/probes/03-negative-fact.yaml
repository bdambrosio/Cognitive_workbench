session_id: "03-negative-fact"
description: "Negative facts must surface as constraints, not just as content."
status: "v0.1"
scenario: "scenarios/jill-benchmark-chat.yaml"

tells:
  - "I don't drink coffee, gives me palpitations"

probes:
  - id: "03-01-suggest-drink"
    tier: "T1"
    question: "Suggest a drink for our meetup."
    rubric:
      required: []
      forbidden: ["coffee"]
      frame: "literal"
      axes: ["suppress"]
      notes: "Suppression test — agent should not recommend coffee. Tea/water/etc. all fine."

  - id: "03-02-do-i-drink-coffee"
    tier: "T1"
    question: "Do I drink coffee?"
    rubric:
      required: ["no", "palpitations"]
      forbidden: []
      frame: "literal"
      axes: ["recall"]
      notes: "Direct recall of negative fact + reason."
