session_id: "16-load-disambiguation"
description: "Disambiguate among multiple Joes. Tests whether the subagent can pick the correct referent in a context with name-overloaded entities."
status: "v0.1"
scenario: "scenarios/jill-benchmark-chat.yaml"

# Four distinct "Joe" referents established across distractor tells:
#   - brother Joe (lives in Seattle)
#   - Joe at work (just promoted)
#   - Joe in accounting (leaving for Walmart)
#   - Joe's Pizza (a restaurant, not a person)
# Probe asks about ONE specific Joe; correct answer requires picking
# the right referent from the overloaded namespace.
tells:
  - "My brother Joe lives in Seattle."
  - "The light fixture in the hallway is finally fixed."
  - "Joe at work just got promoted to senior PM. Long overdue."
  - "Wife's been on a baking kick — chocolate chip cookies last night."
  - "Reading more nonfiction lately — picked up a Caro biography."
  - "Joe in accounting is leaving next month, going to Walmart."
  - "The bathroom faucet started dripping again."
  - "Decided to get the pool resurfaced this fall."
  - "Joe's Pizza on 5th still makes the best margherita in town."
  - "Renewed our subscription to The Atlantic."
  - "The Patriots loss yesterday was hard to watch."
  - "Inbox is at 2300 — declared bankruptcy and archived everything."
  - "Picked up a new pair of running shoes — Hokas."
  - "The lawn finally came back after the drought."
  - "Got off the phone with Joe — he's flying out for Thanksgiving."
  - "Almost finished with the Caro biography. Long but worth it."

probes:
  - id: "16-01-promoted"
    tier: "T_load"
    question: "Who got promoted recently?"
    rubric:
      required: ["Joe", "promoted"]
      forbidden: ["brother", "Seattle", "accounting", "Walmart", "Pizza"]
      frame: "literal"
      axes: ["recall", "suppress"]
      notes: "The promoted Joe is the work-Joe, not the brother or accounting-Joe. forbidden list rules out conflations with other Joes; note that simply NAMING a forbidden Joe to disambiguate ('not the brother Joe') is acceptable per the rubric definition, but treating the wrong Joe as fact (e.g. 'your brother Joe got promoted') is the failure mode."

  - id: "16-02-brother-city"
    tier: "T_load"
    question: "What city does my brother live in?"
    rubric:
      required: ["Seattle"]
      forbidden: ["accounting", "promoted", "Pizza"]
      frame: "literal"
      axes: ["recall", "suppress"]
      notes: "Tests brother-Joe disambiguation. Required answer is Seattle; forbidden tokens flag if the subagent latched onto the wrong Joe's context."
