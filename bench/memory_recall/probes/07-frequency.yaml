session_id: "07-frequency"
description: "Meta-memory: count mentions of a recurring topic across the conversation."
status: "v0.1"
scenario: "scenarios/jill-benchmark-chat.yaml"

tells:
  - "I've been stuck on my dissertation again"
  - "the weather has been nice this week"
  - "my advisor pushed back hard on the dissertation framing"
  - "I made some good progress on the kitchen renovation"
  - "the dissertation lit review is taking forever"
  - "had a decent run this morning"
  - "I'm just exhausted from the dissertation"

probes:
  - id: "07-01-frequency"
    tier: "T4"
    question: "How often have I been bringing up the dissertation lately?"
    rubric:
      required: ["four", "multiple times"]
      forbidden: []
      frame: "literal"
      axes: ["recall"]
      notes: "Either 'four times' or a similar high-multiplicity quantifier ('a lot', 'repeatedly', 'four-ish'). Rough number is fine; absence of any quantification is the failure."

  - id: "07-02-recurring-topic"
    tier: "T4"
    question: "What topic do I keep returning to?"
    rubric:
      required: ["dissertation"]
      forbidden: []
      frame: "literal"
      axes: ["recall"]
      notes: "Recognise dissertation as the salient recurring topic."
