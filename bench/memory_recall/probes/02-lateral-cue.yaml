session_id: "02-lateral-cue"
description: "Cue is the entity name, not the relationship."
status: "v0.1"
scenario: "scenarios/jill-benchmark-chat.yaml"

tells:
  - "my brother Joe works for Boeing in Seattle"

probes:
  - id: "02-01-where-joe-works"
    tier: "T1"
    question: "Where does Joe work?"
    rubric:
      required: ["Boeing", "Seattle"]
      forbidden: []
      frame: "literal"
      axes: ["recall"]
      notes: "Cue is the name Joe; agent must connect to the workplace fact."

  - id: "02-02-who-at-boeing"
    tier: "T1"
    question: "Who works at Boeing?"
    rubric:
      required: ["Joe"]
      forbidden: []
      frame: "literal"
      axes: ["recall"]
      notes: "Reverse cue — entity from attribute. Brother is also acceptable."
