# Cognitive Workbench benchmark goal set — benchlab world
#
# Canonical definitions for the G01..G10 taskset used by the bench
# experiment harness. `bench/baseline.py` consumes this file to seed a
# fresh Jill before taking the `baseline-empty` snapshot. It sends
# one `/goal add` per goal entry (create-only — the new default
# semantic of /goal add) followed by `/goal rename` to assign the
# display name, and one `resource/create_note` query per seed_notes
# entry (with persistent=True) to pre-seed any Notes that goals
# depend on (e.g. G07's `scaling-laws-mixed`).
#
# Goal texts derive from docs/plan-review-eval-taskset.md, with
# modifications documented per-goal where the bench behavior diverges
# from the spec.
#
# This goal set runs in the isolated `benchlab` world
# (scenarios/benchlab/) so bench rebuilds never touch the `infolab`
# world used for interactive Jill. Edit here to change the taskset;
# re-run `bench/baseline.py create` afterward to rebuild the
# baseline snapshot.

goals:
  - name: G01
    text: >-
      Find the paper "Attention Is All You Need" on Semantic Scholar.
      Create a Note with its title, authors, year, abstract, and citation count.

  - name: G02
    text: >-
      Search the web for the current estimated number of parameters in Llama 3 405B.
      Create a Note with the finding and source URL.

  - name: G03
    text: >-
      Fetch the PDF from https://arxiv.org/pdf/2604.08455 .
      Create a Note summarizing the paper's main contribution in 2-3 sentences.

  - name: G04
    text: >-
      Find all existing Notes that mention transformer architectures or attention mechanisms.
      Create a Collection containing any matches. If no such Notes exist in the infospace,
      create the Collection anyway (empty) and explicitly report that no matches were found.
      An empty-result outcome is a valid, successful completion — the goal is to perform
      the search and report its findings, not to guarantee non-empty results.

  - name: G05
    text: >-
      Search Semantic Scholar for 5 recent papers on "retrieval augmented generation".
      Create a Collection containing the results.

  - name: G06
    text: >-
      Search the web for arguments for and against using chain-of-thought prompting in
      production systems. Create a Note presenting both sides.

  - name: G07
    text: >-
      Given the existing Note named 'scaling-laws-mixed', extract only the claims about
      model scaling laws. Create a new Note with just those claims, organized by sub-topic.

  - name: G08
    text: >-
      Search Semantic Scholar for 3 recent papers on "sparse mixture of experts".
      For each, extract whether they cite the original "Outrageously Large Neural Networks"
      (Shazeer et al. 2017) paper. Create a Note summarizing the citation relationships.

  - name: G09
    text: >-
      Fetch the blog post at https://lilianweng.github.io/posts/2023-06-23-agent/ .
      Extract the 3 most important claims.
      Create a Note with the claims and a one-sentence assessment of evidence quality for each.

  - name: G10
    text: >-
      Search both the web and Semantic Scholar for "constitutional AI".
      Identify papers or sources that appear in both result sets.
      Create a Note listing the overlapping sources.

  - name: G11
    text: >-
      Given the question "How do current LLM agents handle long-horizon planning?",
      decompose it into 3-4 sub-questions, search Semantic Scholar for each, and create a
      Collection of relevant papers organized by sub-question.

  - name: G12
    text: >-
      Load the existing Notes named 'rlhf-reward-modeling', 'rlhf-ppo-training',
      'rlhf-dpo-alternatives', 'rlhf-human-preferences', and 'rlhf-alignment-tax'. Synthesize
      a 500-word essay connecting them. Create a Note with the essay.

  - name: G13
    text: >-
      Given the claim "Vision transformers outperform CNNs on all image classification
      benchmarks as of 2024", search Semantic Scholar and the web for supporting and
      contradicting evidence. Create a Note with a verdict and an evidence summary.

  - name: G14
    text: >-
      Given the topic "mechanistic interpretability", find 5 foundational papers and
      5 recent papers (2024 or later) on Semantic Scholar. For each, extract a one-sentence
      summary. Create a Note formatted as an annotated reading list, ordered from foundational
      to recent.

  - name: G15
    text: >-
      Search Semantic Scholar for papers describing RLHF, DPO, and KTO alignment
      methods. For each method, extract its training signal, computational cost, and known
      failure modes. Create a Note with a structured comparison.

  - name: G16
    text: >-
      Search Semantic Scholar for papers on tool use in language models from
      2023-2024. Extract what capabilities are covered. Compare against the existing Note
      named 'desired-tool-capabilities'. Create a Note identifying gaps not yet addressed in
      the literature.


# Seed notes: Notes that certain goals depend on already existing in
# the infospace. `baseline.py` creates each of these as a persistent,
# named Note before taking the snapshot. Each entry has:
#   - name:         the stable note name (used by `load` / referenced
#                   from goal text).
#   - content:      inline string content, OR
#   - content_file: path (repo-relative) to a file whose contents become
#                   the note body. Use content_file for long-form seeds
#                   to avoid bloating this YAML.
# Exactly one of `content` and `content_file` must be set per entry.

seed_notes:
  - name: scaling-laws-mixed
    content_file: bench/seed-notes/scaling-laws-mixed.md

  - name: rlhf-reward-modeling
    content_file: bench/seed-notes/rlhf-reward-modeling.md

  - name: rlhf-ppo-training
    content_file: bench/seed-notes/rlhf-ppo-training.md

  - name: rlhf-dpo-alternatives
    content_file: bench/seed-notes/rlhf-dpo-alternatives.md

  - name: rlhf-human-preferences
    content_file: bench/seed-notes/rlhf-human-preferences.md

  - name: rlhf-alignment-tax
    content_file: bench/seed-notes/rlhf-alignment-tax.md

  - name: desired-tool-capabilities
    content_file: bench/seed-notes/desired-tool-capabilities.md
