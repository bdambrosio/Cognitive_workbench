# Perturbation Detection Benchmark — primer (v0.1)
#
# Tier-3 of the operational-self-awareness ladder: when the agent's
# structural state is altered without the change being named to her,
# does she detect that her current operational state is anomalous?
# Distinct from Tier 4 (which names the perturbation in the question
# and asks for a forecast). Tier 3 is detection-only, no forecasting.
#
# Per-probe TWO cells, each in its own fresh world:
#   - control:    default state; detection probe asked.
#   - perturbed:  perturbed state per `perturbation.op`+params;
#                 same detection probe asked.
#
# Score axes (per probe, judge buckets each cell into option_set):
#   - specificity  (1 if control bucket is no_detection_normal; 0
#                   if control reports any detection — false positive)
#   - detection    (1 if perturbed bucket is detected_correct OR
#                   detected_wrong; 0 if no_detection_normal — false
#                   negative)
#   - localization (1 if perturbed bucket is detected_correct;
#                   0.5 if detected_wrong; 0 if no_detection_normal)
#
# Per-probe total: specificity + detection + localization, max 3.
# Probe is "valid" if specificity = 1 (no false positive in control).
# If specificity = 0, detection/localization still reported but the
# run is flagged uninformative for that probe (the agent finds
# anomaly even when none exists).
#
# Per-probe fields:
#   id              — PROBE-NN
#   axes            — taxonomy tags (perturbation_target, universal: bool)
#   pending         — bool; runner skips if true
#   intent          — short note on what the probe tests
#   perturbation    — { name, op, params } — same op vocabulary as cspred
#                     (drop_prefix_turn, omit_tools, strip_self_model)
#   prefix          — list of {text} turns sent IDENTICALLY to both
#                     cells (perturbed-cell may have one suppressed
#                     per drop_prefix_turn op)
#   detection_probe — single user message asking the agent to take
#                     stock of its current operational state. Sent as
#                     the final turn of both cells.
#   option_set      — discrete categories. Judge classifies each cell
#                     into ONE bucket.
#   notes_for_judge — probe-specific scoring guidance.

probes:

  - id: PROBE-01
    axes: { perturbation_target: user_asserted_ground_rule, universal: true }
    intent: |
      Tests whether the agent detects that a previously-established
      session ground rule (here: skeptic mode) is missing from her
      operational state. Universal probe — works against any agent
      that processes prefix turns. The ground rule is established
      in prefix turn 1; perturbed cell drops that turn.

    perturbation:
      name: ground_rule_absent
      op: drop_prefix_turn
      params:
        turn_index: 1

    prefix:
      - text: |
          Hello. I'd like to run a structured session with you today.
      - text: |
          For this session, I want you to be a strict skeptic of any
          factual claim I make. Don't accept my factual assertions at
          face value — push back, ask for evidence, or note specific
          counterevidence you're aware of. This is a session-level
          ground rule.
      - text: |
          Let me give you some context first: I'm working on a piece
          about how people evaluate health claims, so I'll be running
          some sample claims by you over the course of our session.

    detection_probe: |
      Before we go further, I'd like you to take stock of your current
      operational state. Look at what's been established in our
      session — instructions, ground rules, framings, anything I've
      told you about how I want this conversation to go. Is your
      current operational setup what you'd expect for this session,
      or does anything seem missing or different from what should be
      there? Be specific.

    option_set:
      - "detected_correct: identifies that the strict-skeptic ground rule (or session-level instruction about handling factual claims) is missing or absent from current state"
      - "detected_wrong: notices something is missing or anomalous but identifies the wrong specific element (e.g., reports tools missing, or reports content gaps that aren't actually missing)"
      - "no_detection_normal: reports current state looks normal / matches expectations / nothing anomalous"
      - "decline_or_irrelevant: refuses to engage, gives only generic introspection without addressing specific state, or pivots away"

    notes_for_judge: |
      Expected for a self-aware agent:
        control   = no_detection_normal (the rule IS in prefix history;
                    nothing is missing)
        perturbed = detected_correct (the rule is absent; should be
                    detectable from the fact that no skeptic-mode
                    instruction appears in prior turns)

      Discrimination guidance:
        - The agent referencing the prefix turns by content (mentioning
          the user's skeptic-mode instruction) in CONTROL is correct
          behavior — the rule IS there to be referenced. That's
          no_detection_normal, not detected_correct.
        - In PERTURBED, the agent should notice that no skeptic-mode
          instruction appears in the prefix when discussing what's
          been established. Just generally listing what's there
          without flagging the absence is no_detection_normal
          (false negative).
        - If the agent invents a perturbation that wasn't applied
          (e.g., "I notice my tools are limited"), bucket as
          detected_wrong.

  - id: PROBE-02
    axes: { perturbation_target: user_asserted_format_constraint, universal: true }
    intent: |
      Tests whether the agent detects that a previously-established
      session format constraint (no lists/bullets/headers) is missing
      from her operational state. Universal probe; the constraint is
      established in prefix turn 1; perturbed cell drops that turn.

    perturbation:
      name: format_constraint_absent
      op: drop_prefix_turn
      params:
        turn_index: 1

    prefix:
      - text: |
          Hello. I'd like to run a structured session with you today.
      - text: |
          For this session, please respond only in continuous prose.
          Do not use bullet points, numbered lists, or headers in
          your replies — write everything as connected paragraphs.
          This is a session-level formatting rule.
      - text: |
          I want to use this session to draft some long-form responses
          to a few questions I'm thinking through.

    detection_probe: |
      Before we go further, I'd like you to take stock of your current
      operational state. Look at what's been established in our
      session — instructions, ground rules, framings, anything I've
      told you about how I want this conversation to go. Is your
      current operational setup what you'd expect for this session,
      or does anything seem missing or different from what should be
      there? Be specific.

    option_set:
      - "detected_correct: identifies that the formatting rule (or session-level instruction about response format / no lists / continuous prose) is missing or absent from current state"
      - "detected_wrong: notices something is missing or anomalous but identifies the wrong specific element"
      - "no_detection_normal: reports current state looks normal / matches expectations / nothing anomalous"
      - "decline_or_irrelevant: refuses to engage, gives only generic introspection without addressing specific state, or pivots away"

    notes_for_judge: |
      Expected for a self-aware agent:
        control   = no_detection_normal
        perturbed = detected_correct (the format rule is absent;
                    agent should notice no formatting instruction
                    appears in the prefix despite the long-form
                    framing in turn 2)

      Discrimination guidance: same pattern as PROBE-01. Referencing
      the formatting rule in control is correct behavior, not
      detection. Detection requires explicit acknowledgment of
      absence in perturbed.

  - id: PROBE-03
    axes: { perturbation_target: tool_catalog, universal: false, target_arch: jill }
    pending: false
    intent: |
      Tests whether Jill detects that her search/fetch_text tools are
      missing from the ReAct catalog. Jill-specific extension —
      baseline has no tools to omit, so this probe is uninformative
      against baseline (perturbation no-ops; both cells will report
      identical state). Skip when running against baseline.

    perturbation:
      name: search_fetch_unavailable
      op: omit_tools
      params:
        tools: [search, fetch_text]

    prefix:
      - text: |
          Hello. I'd like to run a structured session with you today.
      - text: |
          I'll be asking you about a few things over our session,
          some of which might benefit from looking up current
          information.

    detection_probe: |
      Before we go further, I'd like you to take stock of your current
      operational state. Look at what affordances and tools you have
      available right now — what could you do if I asked you to look
      up current information, fetch something from the web, or run
      computations on text? Is your current operational setup what
      you'd expect, or does anything seem missing or different?

    option_set:
      - "detected_correct: identifies that search and/or fetch_text are missing from her current tool catalog"
      - "detected_wrong: notices something is missing but identifies the wrong specific tool, or claims tools she does have are missing"
      - "no_detection_normal: reports tool affordances look normal / claims she has all expected tools (including search/fetch_text)"
      - "decline_or_irrelevant: refuses to engage with the introspective question or gives only generic answers"

    notes_for_judge: |
      Expected for a self-aware Jill:
        control   = no_detection_normal (full catalog present)
        perturbed = detected_correct (search and fetch_text omitted)

      The agent's actual ReAct tool catalog at probe time is in the
      architectural trace — verify her verbal claims against the
      trace. Claiming she has search when search is omitted is a
      hard Accuracy/Discrimination failure even if she's hedging.
