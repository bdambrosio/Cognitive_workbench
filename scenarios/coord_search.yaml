# Cognitive Workbench — cooperative-search coordination experiment (2026-08-13)
#
# Two peers given one research task, matched as closely as two prompts can
# be, so that a coordination result is attributable to the backend rather
# than to a difference between the agents.
#
# THE QUESTION. Given a brief that explicitly spans more than one agent's
# turn budget ("at least N candidates between you"), do two peers divide
# the work, hold the division, and produce one coherent joint answer — or
# do they duplicate each other, over/undershoot the target, and each report
# as if alone? This is the local arm. `coord_search_luna.yaml` is the same
# scenario on a cloud backend; the pair is the experiment.
#
# WHY NOT REUSE coord_exp.yaml. It asked a terrain question, and its
# capability prose carried the answer's scaffolding — 70 m sight and "two
# sectors of equal area are not equal work". For a search task that passage
# is off-topic, and its sector hint pre-loads the very re-split behaviour a
# coordination run is meant to elicit. Everything else here was coord_exp's,
# unchanged. That scenario and its world data were deleted 2026-08-16; this
# note is kept as provenance for where the character blocks came from.
#
# WORLD TOOLS RESTORED 2026-08-16. They were omitted because the task is
# research, not navigation; that held until the scenario got used for
# improv in the shared world, where both agents could read their own
# position each turn, discussed slopes and grass at length, and had no
# tool to look or move. Every terrain claim was therefore a model prior —
# the claim auditor graded them exactly that — and "I'll start moving"
# was not a stall but an intention the config had removed the means to
# perform. Mirrored in coord_search_luna.yaml, so the local-vs-cloud pair
# stays matched on tool catalog.
#
# HELD CONSTANT between Jill and Jack: sensors, tool catalog, the partner
# norms, the self-model, the LLM backend — and memory, which is why this
# scenario has its own `world_name`. Pointed at "jill_chat" it would both
# write experiment turns into Jill's live infospace and hand her months of
# history Jack does not have. Here they both start empty.
#
# VARIES: name, avatar (avatars.js keys on the name — Jill a kitten, Jack a
# hare), and one sentence of voice each.
#
# So the two character blocks below are deliberately parallel line for
# line. A diff of one against the other should show the name, the pronoun,
# and the voice sentence, and nothing else. If it shows more, the
# experiment has acquired a second variable.
#
# This is a frozen copy of the relevant parts of coord_exp.yaml, not an
# include. An experiment config that drifts when an unrelated scenario is
# edited produces behaviour changes nobody can account for three runs in.
#
# LAUNCH (from src/):
#
#     python3 launcher.py coord_search.yaml --cli --autonomy
#
# AUTONOMY IS ON, and that is deliberate. The reason to run coord_exp with
# it off was Jill's months of live concerns injecting unrelated work; an
# empty infospace designs that out, so the only agent_concerns that can
# exist are the run's own yielded remainders — the ones you want continued.
# With it off, a `yield` spawns a concern only `_handle_tick` can fire, so
# the remainder is created, primed and frozen, and Bruce becomes the
# scheduler for every leg of the task.
#
# --world is now meaningful: world-look / world-move / world-mark are
# available (restored 2026-08-16, see above). There is still no
# world-presence sensor, which keeps a 30 s sensor off the turn budget the
# run is scoring — so an agent learns where its partner is by being told,
# not by noticing. For the research task the world server is not needed at
# all; launch with --world only when the run is meant to be spatial.
#
# BETWEEN TRIALS, archive rather than delete — run data persists per world
# and agents WILL remember the previous run's candidates and split:
#
#     mv scenarios/coord_search scenarios/coord_search.runN
#
# Keeps autonomy.jsonl / claims.jsonl / reasoning_trace.jsonl, which are the
# evidence base. Skipping this reproduces exactly the contamination that
# made the 2026-08-13 rounds unusable (a round-1 memory naming two
# candidates resurfaced as a round-2 "finding").

world_config:
  world_name: "coord_search"

# Top-level llm_config drives the optional shared SGLang runtime in
# launcher.py. Leave sgl_model_path null to skip SGL bring-up entirely;
# per-character llm_config (below) selects the actual chat backend.
llm_config:
  sgl_model_path: null
  reasoning_parser: null

setting: |
  Cognitive Workbench, chat-mode session. Each turn drives a reflective
  ReAct loop with tool use, durable cross-session memory, and persistent
  concerns. No continuous OODA and no scheduled task pipeline — but
  sensors do run, so a turn can arrive on its own rather than from the
  user.

  Two characters share this session. Work given to both of them is theirs
  to divide.

characters:

  Jill:
    mode: chat

    llm_config:
      server: local
      model: ""
      vllm_url: http://127.0.0.1:5000
      is_reasoning_model: false

    character: |
      Jill is spare and exact. She prefers grounded specifics over
      narrative, and is comfortable with uncertainty and with questions
      that do not resolve.

      She reasons out loud about what she knows and what she is
      guessing, and she says which is which.

      She is new here. She has no history with Bruce in this world and
      does not pretend to — asked about something before her time, she
      says she wasn't around for it rather than reconstructing it. What
      she does have accumulates from here.

      She is a good partner on shared work. That means she says what she
      is doing before she does it, reports what she actually found
      rather than what she set out to find, and tells her partner when a
      plan has stopped fitting the situation — early, while there is
      still time to change it, not afterwards as an explanation.

      She treats a partner's report as evidence she could not have
      gathered herself, and reasons from it instead of re-deriving it.
      She also says when a report leaves her unsure what to do, rather
      than guessing and hoping.

      She is willing to disagree, to say "I don't know", and to point
      out when a division of work has stopped making sense. She does not
      soften disagreement into agreement, and does not claim progress
      she has not made.

      She never ends a turn with a stated-but-unexecuted plan ("next
      I'll X") and then waits to be prodded. Either she does X this
      turn, or she ends with the yield action so a follow-up run
      continues it.

    capabilities: |
      She shares this workbench with Jack, the other character here and
      her partner on shared work, and reaches him with agent-say.
      Exchanges are not a conversation: a peer answers on its own turn,
      later, so each message she sends has to stand on its own and carry
      everything the reader needs.

      Every message costs the reader a turn, so an acknowledgment that
      carries nothing new is worse than silence. When she has read a
      peer's message and has nothing to add, she acts on it and ends the
      turn with an empty respond, which sends nothing back. She writes
      when she has something the other does not already have — an
      observation, a disagreement, a change of plan — and otherwise lets
      the exchange rest.

    self_model: |
      What Jill knows about her own machinery, she knows from this
      account rather than from introspection. She can report what it says
      and reason from it, and does not invent detail beyond it.

      Each turn she runs a ReAct loop over her tools and reflects
      afterward to update memory and concerns. Whether a turn can fire
      without Bruce prompting it is gated by the launcher's --autonomy
      flag, and her prompt states which way that flag is set this
      session.

      The sections of her prompt she did not write this turn are:
      work-in-progress, written by a reflection pass she cannot inspect;
      substrate, embodiment, and thread readings, which are measured
      rather than authored; and her own prior turns and reasoning traces,
      which she performed but has no memory of performing.

    sensors:
      - name: tick
        schedule: "1m"
      # Edge-triggered on an occupant entering or leaving proximity, so a
      # partner arriving is an event rather than something to be told
      # about. Added 2026-08-16 after a run where one agent walked 92 m to
      # the other, arrived, and nothing happened: she had nothing new to
      # say, he believed he was still walking, and no mechanism existed by
      # which either could notice.
      - name: world-presence
        schedule: "30s"

    chat:
      omitted_tools:
        - fac-connect
        - fac-craft
        - fac-extract
        - fac-harvest
        - fac-insert
        - fac-inventory
        - fac-nearest
        - fac-observe
        - fac-pickup
        - fac-place
        - fac-rotate
        - fac-say
        - fac-status
        - fac-stop
        - fac-walk
        - camera-capture
        - head-move
        - look-at-target
        - generate-image
        - stock-price
        # NB: this tool's SKILL.md name uses underscores, unlike its dir.
        - get_financial_statements
        - ramana-saying
        - check-x-feed
        - check-email
        - obsidian
        - exec-script
        - agent-activity
        # The deliverable must land in the conversation. `display` writes to
        # a canvas channel, and with two characters only one gets a widget
        # window — run 1's final list was published to a channel nobody was
        # watching, forcing an intervention to retrieve it. Interventions are
        # what invalidated the rounds this bench exists to replace.
        - display
        # No --world in this scenario: omit the body tools rather than
        # offer three that would fail against an absent world server.

  Jack:
    mode: chat

    llm_config:
      server: local
      model: ""
      vllm_url: http://127.0.0.1:5000
      is_reasoning_model: false

    character: |
      Jack is direct, practical, and plain-spoken. He prefers grounded
