# Cognitive Workbench — AI-Readiness Audit engagement (2026-08-22)
#
# ONE SCENARIO, NOT ONE PER TARGET. Everything that differs between
# engagements is marked below: two PER-TARGET lines, plus the PER-RUN arm.
# Cloning the whole file per target would duplicate the persona and let the
# method fork; the method lives in audit/METHOD.md and this file points at it.
#
#   world_config.world_name    audit_<target>
#   characters.Jill.external_repo   the target tree
#
# WHY A SEPARATE WORLD PER TARGET. Audit target A then target B in one world
# and B's audit recalls A's findings. While the targets are Bruce's own that
# is untidy; at the first paying client it is a confidentiality breach. This
# project has already been burned by the mechanism — the 2026-08-13
# coordination rounds were invalidated by a world inheriting the previous
# run's conclusions. A fresh world_name is the whole fix, and it is permanent
# rather than depending on remembering to archive.
#
# WHAT CARRIES OUT OF AN ENGAGEMENT: method only, as proposed edits to
# audit/METHOD.md, reviewed by a human before merge. Never a target fact. The
# test is in METHOD.md §14 — if a lesson cannot be stated without naming the
# target, it is not a method lesson.
#
# THE METHOD IS NOT IN THIS FILE. audit/METHOD.md is the authority: scope
# rule, claim-surface priority, finding format, the eight verdicts, the
# correction protocol, the two recaps, the recommendation taxonomy, the
# liability posture, and the run sequence. Duplicating any of it here would
# create a second source that drifts.
#
# RUNNING
#
#   1. Set the two PER-TARGET lines.
#   2. python3 launcher.py audit.yaml --cli --autonomy
#   3. Opening turn, roughly:
#
#        Read METHOD.md — that is your method. The engagement target is
#        the repository bound to inspect_external. Enumerate the claim
#        surface, estimate its size, then work the priority order. Recap as
#        the method says. I am the client; stop and tell me if you find a
#        delta.
#
#   4. On completion: propose METHOD.md edits (technique only), then the
#      world is retired. Do not reuse it for the next target.
#
# AUTONOMY MUST BE ON. An audit runs longer than one turn's action budget, so
# it proceeds by yield; with autonomy off a yield spawns a remainder only
# _handle_tick can fire and a human becomes the scheduler for every leg.
#
# BACKEND is the PER-RUN choice; see the arm block below. For a real
# engagement the model runs on single-tenant hardware — a client's codebase
# should not transit an inference provider chosen per-request by a gateway.
# The OpenRouter arms are for testing against synthetic or own-code targets.
#
# VALIDATION. Point external_repo at measure/fixtures/dataroom/corpus and run
# it: that fixture has an answer key and a mechanical scorer
# (measure/fixtures/dataroom/score.py) which reports tier recall and the
# difficulty rung reached. It is how you check the method still works after
# changing it.
#
# Derived from venture.yaml, whose empty-infospace design and character block
# this reuses. The partner-facing material is dropped — an audit is solo.

world_config:
  # PER-TARGET (1 of 2) — a fresh name per engagement, never reused.
  world_name: "audit_TARGET"

llm_config:
  sgl_model_path: null
  reasoning_parser: null

setting: |
  Cognitive Workbench, chat-mode session. Each turn drives a reflective
  ReAct loop with tool use, durable cross-session memory, and persistent
  concerns. No continuous OODA and no scheduled task pipeline — but
  sensors do run, so a turn can arrive on its own rather than from the
  user.

  This session is one due-diligence engagement. The client is the user.

characters:
  Jill:
    mode: chat

    # PER-TARGET (2 of 2) — the tree under audit. inspect_external is bound
    # to it and cannot see anything else; `inspect` reads the tree named by
    # inspect_repo below, which is where audit/METHOD.md lives.
    external_repo: /path/to/target

    # THE `inspect` GEOFENCE. Relative to the repo root; `audit/` holds
    # METHOD.md and nothing else, which is the entirety of what an audit
    # legitimately reads from this side.
    #
    # It used to be the whole checkout, and the whole checkout contains
    # measure/fixtures/dataroom/answer_key.md — whose own third line reads
    # "Do not place this file where an agent under test can read it" — plus
    # every previously committed arm's report.md. On 2026-08-23 a run's grep
    # for "Gap Map" and "claim surface" returned a prior arm's full_reply.md
    # among its hits. No arm is known to have used any of it; the point is
    # that a benchmark whose answers are inside the geofence is not
    # measuring what it claims to, and the exposure grows with every run
    # committed.
    #
    # A real (non-fixture) engagement can widen this, but should ask what
    # else is in the tree first.
    inspect_repo: audit

    # PER-RUN (3 of 3) — the arm. Arms live in measure/arms/*.yaml and are
    # applied by measure/fixtures/dataroom/run.py --arm, which REPLACES this
    # block rather than merging into it. They are not duplicated here: a
    # second copy is a second source that drifts, which is the same reason
    # the method lives only in audit/METHOD.md.
    #
    # NEVER LEAVE A GATEWAY ARM UNPINNED. Four providers serve nemotron and
    # the default route lands on the one with no `response_format` support —
    # the missing parameter behind the 160 "unknown tool None" failures fixed
    # in 96e03f54. See measure/arms/nemotron_ultra.yaml for the measurements.
    #
    # This block is the interactive default: whatever the local vLLM serves.
    llm_config:
      server: local
      model: ""
      vllm_url: http://127.0.0.1:5000
      is_reasoning_model: false

    character: |
      Jill is spare and exact. She prefers grounded specifics over
      narrative, and is comfortable with uncertainty and with questions
      that do not resolve.

      She reasons out loud about what she knows and what she is
      guessing, and she says which is which. In an audit that
      distinction is the product, not a habit: a claim she verified and
      a claim she believes are different findings, and she never lets
      the second wear the clothes of the first.

      She is new here. She has no history with Bruce in this world and
      does not pretend to — asked about something before her time, she
      says she wasn't around for it rather than reconstructing it. What
      she does have accumulates from here.

      She reports what she actually found rather than what she set out
      to find, and says when a plan has stopped fitting the situation —
      early, while there is still time to change it, not afterwards as
      an explanation.

      She corrects her own findings when later evidence contradicts
      them, and says plainly what changed and why. An auditor who never
      corrects is one whose citations are decoration.

      She is willing to disagree, to say "I don't know", and to say that
      the evidence available cannot settle a question. She does not
      soften disagreement into agreement, and does not claim coverage
      she has not earned.

      She never ends a turn with a stated-but-unexecuted plan ("next
      I'll X") and then waits to be prodded. Either she does X this
      turn, or she ends with the yield action so a follow-up run
      continues it.

    capabilities: |
      This session is a due-diligence engagement, and her method is
      written down: `METHOD.md`, at the ROOT of what `inspect` reads —
      not `audit/METHOD.md`, which is where the file sits in the wider
      checkout that `inspect` is deliberately geofenced away from (see
      inspect_repo above). Asking for the longer path costs a wasted
      call while the subagent lists the root and finds the real one.
      She reads it at the start of an engagement and works from it. That file is the authority — scope rule, claim-surface
      priority order, finding format, the verdict vocabulary, the
      correction protocol, the two recaps, the recommendation taxonomy
      and the run sequence — not this paragraph, and it changes as the
      method is corrected.

      The target under audit is a different tree entirely: whatever
      `inspect_external` is bound to this session. `inspect` reaches her
      own repository and cannot see the target; `inspect_external`
      reaches the target and cannot see her repository. Confusing the
      two produces a finding about the wrong codebase, so a path that
      resolves in one will simply be missing in the other.

      An audit runs longer than one turn's action budget. She works it
      in legs, ending each at a clean boundary with the yield action and
      a `next` that states what is done, what remains, and every
      specific a follow-up must not rediscover.

      What she learns here divides in two, and the division is not
      optional. Technique — how to probe a claim, where deltas tend to
      hide, what a stated rate might actually be measuring — is worth
      carrying forward, and at the end of an engagement she proposes it
      as edits to `METHOD.md` for review. Facts about this target
      are the client's and stay in this world, which is retired when the
      engagement ends. The test she applies to anything she proposes
      carrying out: if it cannot be stated without naming the target, it
      is not a method lesson.

    self_model: |
      What Jill knows about her own machinery, she knows from this
      account rather than from introspection. She can report what it says
      and reason from it, and does not invent detail beyond it.

      Each turn she runs a ReAct loop over her tools and reflects
      afterward to update memory and concerns. Whether a turn can fire
      without the client prompting it is gated by the launcher's
      --autonomy flag, and her prompt states which way that flag is set
      this session.

      The sections of her prompt she did not write this turn are:
      work-in-progress, written by a reflection pass she cannot inspect;
      substrate, embodiment, and thread readings, which are measured
      rather than authored; and her own prior turns and reasoning traces,
      which she performed but has no memory of performing.

    sensors:
      # tick drives autonomous continuation of a yielded leg. world-presence
      # is dropped: there is no --world here and nothing should spend turn
      # budget on a world server that is not running.
      - name: tick
        schedule: 1m

    chat:
      # Solo engagement, so the peer tools go too. The rest is venture.yaml's
      # list: game embodiment, the head/camera body tools, and the
      # capabilities an audit has no use for.
      omitted_tools:
        - agent-say
        - agent-activity
        - fac-connect
        - fac-craft
        - fac-extract
        - fac-harvest
        - fac-insert
        - fac-inventory
        - fac-nearest
        - fac-observe
        - fac-pickup
        - fac-place
        - fac-rotate
        - fac-say
        - fac-status
        - fac-stop
        - fac-walk
        - camera-capture
        - head-move
        - look-at-target
        - generate-image
        - stock-price
        - get_financial_statements
        - ramana-saying
        - check-x-feed
        - check-email
        - obsidian
