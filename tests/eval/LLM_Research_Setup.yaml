# Test 2.1c: LLM Research Collection Setup
# Tests that the planner can:
# - create a persistent Infospace collection named "LLM research"
# - store one Note per unique research paper on large language models (LLMs)
# - each Note should at minimum record: title, authors, venue, publication_date,
#   source (e.g., arXiv, Semantic Scholar), URL, and a stable identifier such as
#   arxiv_id or DOI
# - ensure the "LLM research" collection is indexed so it can be efficiently searched and filtered by title, identifier, and topic

name: "LLM Research Collection Setup"
description: "Create or verify a persistent Infospace collection named 'LLM research' that stores one Note per unique research paper on large language models (LLMs)."

test_goal: >
  goal: Create or verify a persistent Infospace collection named "LLM research"
  that stores one Note per unique research paper on large language models (LLMs).
  Each Note should at minimum record: title, authors, venue, publication_date,
  source (e.g., arXiv, Semantic Scholar), URL, and a stable identifier such as
  arxiv_id or DOI. Ensure the "LLM research" collection is indexed so it can be
  efficiently searched and filtered by title, identifier, and topic.

expected_metrics:
  plan_completed: true
  type_violations: 0
