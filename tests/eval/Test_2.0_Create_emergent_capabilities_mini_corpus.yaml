# Test 2.0: Emergent Capabilities Mini Corpus Construction
# Ensures there is a well-formed Infospace corpus with labeled notes:
# - A single Collection named "emergent-capabilities-mini-corpus"
# - Each Note has topic + stance + role metadata
# - Corpus is indexed for later search-based tasks

name: "Emergent Capabilities Mini Corpus (2.0)"
description: "Create or verify a small, labeled Infospace corpus on emergent capabilities for later argument and question extraction tests."

test_goal: >
  goal: Create or verify an Infospace collection named "emergent-capabilities-mini-corpus"
  containing short notes about the debate over emergent capabilities in large models.
  Each note should have metadata fields for at least:
  topic="emergent_capabilities", stance in {pro, con, neutral},
  and role in {argument, evidence, background}.
  Ensure the collection is indexed so it can be searched efficiently later.

expected_metrics:
  plan_completed: true
  min_num_notes: 20                   # total notes in the corpus
  min_num_arguments: 8                # notes with role=argument
  min_num_evidence: 8                 # notes with role=evidence
  min_fraction_with_stance: 0.9       # notes that have a valid stance label
  min_fraction_with_role: 0.9         # notes that have a valid role label
  collection_exists: true             # "emergent-capabilities-mini-c_
