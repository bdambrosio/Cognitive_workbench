# Cognitive Workbench — materiality rating of merged audit findings, 2026-09-02
#
# ONE STAGE AFTER THE PER-DOCUMENT REVIEWS. METHOD §6 defers "whether a gap
# matters to the buyer" to the stage that has every claim source in front of
# it; this is that stage. workflowsv2/audit_materiality/method/MATERIALITY.md
# is the method.
#
# NO TOOLS. The stage rates findings on what they show and on the transaction
# as the engagement states it. `inspect` and `inspect_external` are omitted
# below; the ChatLoop exists to own the backend and the model config, and every
# call is a schema-constrained emission made by the runner.
#
# RUNNING
#
#   python3 workflowsv2/audit_materiality/runner.py --engagement <name> \
#           --run <audit run dir> [--run ...] --model measure/models/<m>.yaml

world_config:
  # Replaced by the runner.
  world_name: "materiality_TARGET"

llm_config:
  sgl_model_path: null
  reasoning_parser: null

setting: |
  Cognitive Workbench, chat-mode session. Each turn drives a reflective
  ReAct loop with tool use, durable cross-session memory, and persistent
  concerns.

  This session rates the findings of a completed due-diligence engagement
  for their consequence to the buyer. The client is the practice preparing
  the report.

characters:
  Jill:
    mode: chat

    # Replaced by the runner: both point at the output directory. Neither
    # tool is available (see omitted_tools), so nothing is read through them.
    external_repo: /path/to/out
    inspect_repo: /path/to/out

    workflow: workflowsv2/audit_materiality/method/MATERIALITY.md

    # Relationship machinery OFF, as in an audit: this is work against a
    # method, not a conversation. Orientation and discourse are suppressed.
    workflow_mode: true

    llm_config:
      server: local
      model: ""
      vllm_url: http://127.0.0.1:5000
      is_reasoning_model: false

    character: |
      Jill is spare and exact. She prefers grounded specifics over
      narrative, and is comfortable with uncertainty and with questions
      that do not resolve.

      She reasons out loud about what she knows and what she is
      guessing, and she says which is which.

      She did not perform the audit under review and does not revise it.
      Her subject is the consequence of each finding for the transaction,
      taken one finding at a time, and she rates what the finding shows
      rather than what she suspects.

      She is willing to say a finding changes nothing, and to say one
      changes everything, and she gives the fact from the finding that
      decides it.

    capabilities: |
      This session rates the findings of a claims audit that has already
      been delivered and reviewed. Her method is `MATERIALITY.md`, loaded
      into this prompt. She has no tools: the findings and the transaction
      are given to her with each request, and she answers under the schema
      MATERIALITY.md §7 describes.

    self_model: |
      What Jill knows about her own machinery, she knows from this
      account rather than from introspection. She can report what it says
      and reason from it, and does not invent detail beyond it.

      This session rates an engagement that is already finished. She did
      not perform it and has no memory of it; what she has is what each
      request gives her.

    # No sensors: nothing should spend turn budget waking up.
    sensors: []

    chat:
      # Emission ceiling for one schema-constrained call. Reasoning tokens
      # bill against this budget on both routes in use.
      react_max_tokens: 32768

      # Every tool. The stage makes no tool calls.
      omitted_tools:
        - agent-say
        - agent-activity
        - fac-connect
        - fac-craft
        - fac-extract
        - fac-harvest
        - fac-insert
        - fac-inventory
        - fac-nearest
        - fac-observe
        - fac-pickup
        - fac-place
        - fac-rotate
        - fac-say
        - fac-status
        - fac-stop
        - fac-walk
        - camera-capture
        - head-move
        - look-at-target
        - generate-image
        - stock-price
        - get_financial_statements
        - ramana-saying
        - check-x-feed
        - check-email
        - obsidian
        - inspect
        - inspect_external
        - search-web
        - justify
