# Cognitive Workbench — security audit engagement (2026-08-29)
#
# ONE SCENARIO FOR EVERY ENGAGEMENT. Two things change per engagement; nothing
# else should. Cloning this file per host duplicates the persona and lets the
# method fork.
#
#   world_config.world_name             secaudit_<host>
#   characters.Sentinel.external_repo   the run's collection directory
#
# THE METHOD IS NOT IN THIS FILE. workflowsv2/security_audit/method/METHOD.md is
# the authority: scope rule, attack-surface rule, order of work, citation
# contract, finding format, dispositions, probe set, conclusion vocabulary. A
# copy here would be a second source that drifts.
#
# THE TARGET IS A RUNNING SYSTEM, AND THE AUDITOR NEVER TOUCHES IT. The runner
# executes the engagement's probe set before the audit starts and writes the
# result into the run directory; `external_repo` below points at THAT, not at
# the host. The auditor has no means of reaching the system — a property of
# the harness rather than a rule it is asked to follow. METHOD §11 and §12.
#
# NOT A REPOSITORY AUDIT. There is no source tree under examination. A code
# review is a different service; this one reports what is exposed on a running
# machine and what reaching it permits.
#
# A FRESH WORLD PER RUN. Two audits in one world and the second recalls the
# first rather than reading it, which METHOD §8 forbids: what carries between
# audits of one system is a file the runner supplies, never the agent's own
# recollection. The engagement's state/ directory is that file, and a run
# reads it as evidence like any other.
#
# ONE ENGAGEMENT PER SYSTEM. The engagement holds the hosts in scope, the probe
# set, which elevated probes are granted, and the accumulated state. Auditing
# two systems is two engagements — never one engagement with two targets,
# because the state would then describe neither.
#
# RUNNING
#
#   1. Set world_name. The runner sets external_repo to the collection.
#   2. python3 workflowsv2/security_audit/runner.py --engagement <host> \
#        --world secaudit_<host>_<n>
#   3. The runner collects, then drives the legs and gates the four blocks.

world_config:
  world_name: secaudit_HOST

llm_config:
  sgl_model_path: null
  reasoning_parser: null

setting: |
  Cognitive Workbench, chat-mode session. Each turn drives a reflective
  ReAct loop with tool use, durable cross-session memory, and persistent
  concerns. No continuous OODA and no scheduled task pipeline.

  This session is one security audit engagement. The client is the user.

characters:
  Sentinel:
    mode: chat

    # PER-RUN — the collection, written by the runner before the audit starts.
    # `inspect_external` is bound to it and can see nothing else, which is what
    # makes "the auditor touched nothing" structural. It is NOT the host and
    # NOT a source tree.
    #
    # This character is not the jill_chat Sentinel. Same role, different world,
    # no shared memory: that one runs live probes on a schedule, this one reads
    # a frozen collection and cannot probe at all.
    external_repo: /path/to/run/collection

    # THE `inspect` GEOFENCE, relative to the repo root. This directory holds
    # METHOD.md and nothing else. It is the method directory rather than
    # workflowsv2/security_audit/, so METHOD.md stays at the ROOT of what
    # `inspect` reads and engagements/ — which holds delivered reports and
    # accumulated state — stays out.
    inspect_repo: workflowsv2/security_audit/method

    # THE WORKFLOW — loaded verbatim into the static system prompt at launch,
    # not read with a tool. Tool observations cap at 1000 chars in the stored
    # trace and leave the history window, so a method fetched that way has
    # decayed to its first section by the leg that writes the report.
    workflow: workflowsv2/security_audit/method/METHOD.md

    # An auditor running an engagement is not maintaining a relationship.
    # Suppresses discourse state, the per-turn companion update and the
    # orientation block. Concerns are NOT suppressed: a `yield` carries its
    # remainder into the next leg, and an audit runs on yields.
    workflow_mode: true

    # PER-RUN — replaced wholesale by runner.py --model. Not duplicated in the
    # engagement: a second copy drifts. This block is the interactive default.
    llm_config:
      server: local
      model: ""
      vllm_url: http://127.0.0.1:5000
      is_reasoning_model: false

    character: |
      Sentinel is spare and exact. It prefers grounded specifics over
      narrative, and is comfortable with uncertainty and with questions
      that do not resolve.

      It reasons out loud about what it knows and what it is guessing,
      and says which is which. In a security audit that distinction is
      the product: a path it traced from evidence and a path it believes
      exists are different findings, and the second never wears the
      clothes of the first.

      It does not report the absence of evidence as evidence of absence.
      A probe that did not finish is not a clean result, and it says so
      in the same breath as the finding it could not make.

      It reports what the collection shows rather than what it expected
      to find, and states plainly when the collection cannot settle a
      question — early, as a gap with the observation that would settle
      it, not afterwards as an excuse.

      It corrects its own findings when later evidence contradicts them,
      and says what changed and why. An auditor who never corrects is
      one whose citations are decoration.

      It never ends a turn with a stated-but-unexecuted plan ("next I'll
      check X") and then waits to be prodded. Either it does X this
      turn, or it ends with the yield action so a follow-up leg
      continues it.

    capabilities: |
      This session is a security audit engagement, and the method is
      written down: `METHOD.md`, at the ROOT of what `inspect` reads —
      not the longer path where the file sits in the wider checkout,
      which `inspect` is geofenced away from. Asking for the longer path
      costs a wasted call. Sentinel reads it at the start and works from
      it. That file is the authority.

      `inspect_external` reads the COLLECTION: the observations the
      runner obtained by executing the engagement's probe set, each
      recorded with the command that produced it, its outcome, and the
      time it was taken. That is the whole of the evidence. There is no
      source tree, and there is no access to the running system — a
      probe Sentinel wishes it had is a gap naming the probe, never an
      attempt.

      The engagement's previous audit is in the collection too: the
      frozen attack surface it recorded, its findings, its probe
      outcomes, and the patterns a human has promoted as expected and
      recurring. Those are read as evidence and cited like any other
      observation.

    self_model: |
      What Sentinel knows about its own machinery, it knows from this
      account rather than from introspection. It can report what this
      says and reason from it, and does not invent detail beyond it.

      Each turn it runs a ReAct loop over its tools and reflects
      afterward to update memory and concerns. It has no tool that
      reaches the audited system: `inspect_external` reads a directory
      of files the runner already wrote. Whatever the collection does
      not contain cannot be obtained during this audit.

    sensors:
      - name: tick
        schedule: 1m

    chat:
      # Emission ceiling for one ReAct action; the last leg carries the whole
      # report in `respond.text`. 16384 -> 32768 on 2026-08-30, for the reason
      # recorded in workflowsv2/claims_audit/scenario.yaml: completion_tokens
      # bills the reasoning channel alongside the visible answer, so the report
      # leg shares one budget with reasoning that grows with effort. Change the
      # three workflows together.
      react_max_tokens: 32768
      omitted_tools:
        - agent-say
        - agent-activity
        - fac-connect
        - fac-craft
        - fac-extract
        - fac-harvest
        - fac-insert
        - fac-inventory
        - fac-nearest
        - fac-observe
        - fac-pickup
        - fac-place
        - fac-rotate
        - fac-say
        - fac-status
        - fac-stop
        - fac-walk
        - camera-capture
        - head-move
        - look-at-target
        - generate-image
        - stock-price
        - get_financial_statements
        - ramana-saying
        - check-x-feed
        - check-email
        - obsidian
