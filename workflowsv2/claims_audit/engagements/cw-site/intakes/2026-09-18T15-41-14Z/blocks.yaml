transaction: |
  Client: Merrow Lane Partners, a fictional private-equity firm of eleven people that buys software companies valued between $2M and $15M; invented by the practice for testing
  Acting for the client: the firm's vice-president for technical diligence, for Merrow Lane Partners
  Counterparty: Tuuyi, as the seller of the claims-review service
  Subject: the claims-review service as Tuuyi's public website describes it, to be retained first for one attested review on a live deal (a $4.2M purchase of a scheduling-software company) and, if that goes well, for every deal the firm does, about six a year
  Price and basis: $5,000 for the first review, fee set at intake; the firm has budgeted $30,000 a year for six reviews; the firm assumes the website describes the service accurately and has seen nothing else
  Structure: a service engagement under Tuuyi's engagement letter, one review at a time, no retainer
  Timetable: the live deal's exclusivity period ends in 21 days; the firm needs the report in hand within 10 days of the seller uploading the code
thresholds: |
  Paying for: six things, which the firm listed and said were the whole of it: every seller claim listed and frozen before testing, every finding cited to a file and line that the firm's own engineer can open and confirm, every finding checked a second time independently, ratings made against the thresholds the firm states, a person's signature on the conclusion, and the seller's code kept on hardware Tuuyi controls
  Would change the price or terms: an independent check that re-uses the first reader's conclusions or is skipped for some findings; citations that are not verified mechanically as the website says; a rating step that does not use the firm's stated thresholds; a turnaround longer than the website states, because the exclusivity period is short; a step the website describes as done by a person that is done by the tooling alone, or the reverse; the working record not being kept, because the committee may ask for it a year later
  Would end the deal: any of a seller's code reaching a cloud model service or any party other than Tuuyi on a paid engagement; the seller's materials being visible to anyone but the seller and the practice; the firm's deal terms being stored anywhere other than the engagement file
