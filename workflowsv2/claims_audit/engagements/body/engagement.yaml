# claims-audit engagement: body
#
# Body, a mobile robot platform: Raspberry Pi controller, chassis and sensor
# drivers, desktop-side stub for teleoperation and mapping.
#
# WHAT THE ENGAGEMENT SUPPLIES, and the method must not invent: the target, and
# the claim sources named in brief.md (METHOD §12 step 1). Three models given
# the same nine documents enumerated 62, 67 and 273 claims before the sources
# were named per engagement.

target: /home/bruce/projects/Body/Body

# THE CLAIM SOURCES, as data rather than as prose — brief.md says the same in
# words and must stay in step. The runner's ledger counts this set; until
# 2026-08-29 it globbed `*.md` in the target root, which here happened to find
# exactly these two and so was accidentally right. It was not right on
# ChatterMate.
#
# DELIBERATELY EXCLUDED, and the reason is the interesting one:
# `docs/agent_desktop_stub_spec.md` (165 lines) declares itself "Status:
# Specification only (not yet implemented in this repo)". A specification for
# something unbuilt asserts what is INTENDED, not what is — audit it as a claim
# source and every claim in it is correctly unsupported, a page of findings
# about features nobody claimed to have. It is neither claim nor evidence about
# the current system; it is a plan.
#
# ALSO EXCLUDED, less interestingly: 26 of this tree's 30 documentation-shaped
# files are under .venv/ — numpy's LICENSE, pip's AUTHORS.txt. Any scheme that
# finds claim sources by scanning would audit the dependencies.
claim_sources:
  - README.md
  - body_project_spec.md

# Runs land in runs/ beside this file. Retention is an engagement fact, not a
# harness default: a real client's run holds verbatim client material and
# carries a destruction date under the engagement letter (METHOD §14).
retention: keep — own project
