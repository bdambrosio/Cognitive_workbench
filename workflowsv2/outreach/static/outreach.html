<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tuuyi outreach</title>
<style>
  :root { color-scheme:dark; --ink:#e3e5e8; --soft:#a0a6b0; --line:#474b52; --bg:#2b2d31; --card:#34373c; --field:#2b2d31; --button:#3d4147; --go:#2f8f63; --warn:#e0a44a; --stop:#e89090; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; color:var(--ink); background:var(--bg); }
  header { padding:14px 20px; background:var(--card); border-bottom:1px solid var(--line); display:flex; gap:18px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  #counts { color:var(--soft); font-size:13px; }
  main { max-width:980px; margin:0 auto; padding:16px 16px 60px; }
  section { margin-top:22px; }
  h2 { font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--soft); margin:0 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:12px; }
  .card h3 { margin:0; font-size:16px; }
  .meta { color:var(--soft); font-size:13px; margin:2px 0 8px; }
  .meta a { color:inherit; }
  .why { margin:6px 0 10px; }
  .flag { color:var(--warn); font-size:13px; margin:2px 0; }
  textarea, input, select { font:inherit; width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--field); color:var(--ink); }
  textarea.msg { min-height:150px; }
  .row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; align-items:center; }
  .row > * { flex:0 0 auto; width:auto; }
  .row .grow { flex:1 1 200px; }
  button { font:inherit; padding:7px 14px; border-radius:6px; border:1px solid var(--line); background:var(--button); color:var(--ink); cursor:pointer; }
  button.go { background:var(--go); border-color:var(--go); color:#fff; }
  button.stop { color:var(--stop); }
  button:disabled { opacity:.5; cursor:default; }
  details { margin-top:8px; }
  summary { cursor:pointer; color:var(--soft); font-size:13px; }
  pre.brief { white-space:pre-wrap; font:13px/1.45 ui-monospace, monospace; background:var(--bg); padding:10px; border-radius:6px; max-height:420px; overflow:auto; }
  .words { color:var(--soft); font-size:12px; }
  .said { border-left:3px solid var(--line); padding:2px 0 2px 10px; margin:6px 0; white-space:pre-wrap; }
  .gives { margin:6px 0; padding-left:18px; }
  .gives li { margin:2px 0; }
  section.empty { display:none; }
  #note { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:6px; display:none; max-width:90%; }
  #runlog { font:12px/1.4 ui-monospace, monospace; color:var(--soft); white-space:pre-wrap; margin-top:8px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  @media (max-width:640px) { .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>Tuuyi outreach</h1>
  <span id="counts">loading…</span>
</header>
<main>
  <section>
    <h2>Replies</h2>
    <div id="replies"></div>
  </section>

  <section>
    <h2>Follow-up due</h2>
    <div id="followup"></div>
  </section>

  <section>
    <h2>Ready to contact</h2>
    <div id="ready"></div>
  </section>

  <section>
    <h2>No response to the follow-up</h2>
    <div id="noresponse"></div>
  </section>

  <section>
    <h2>Sent, waiting for a reply</h2>
    <div id="waiting"></div>
  </section>

  <section>
    <h2>Qualified, no reason to write yet</h2>
    <div id="qualified"></div>
  </section>

  <section>
    <h2>Waiting for research</h2>
    <div id="research"></div>
  </section>

  <section>
    <h2>Add a name</h2>
    <div class="card">
      <div class="grid">
        <input id="a_name" placeholder="Name">
        <input id="a_title" placeholder="Title and firm (optional)">
        <input id="a_linkedin" placeholder="LinkedIn URL (optional)">
        <input id="a_how" placeholder="How you know them, or who introduced them (optional)">
      </div>
      <div class="row"><input class="grow" id="a_source" placeholder="Where the pasted text is from, e.g. LinkedIn post of 14 Sept"></div>
      <div class="row"><textarea class="grow" id="a_pasted" placeholder="Paste a post, an email, anything that gives a reason to write (optional)" style="min-height:90px"></textarea></div>
      <div class="row"><button class="go" onclick="addName()">Add to Research</button></div>
    </div>
  </section>

  <section>
    <h2>Run</h2>
    <div class="card">
      <div class="row">
        <button class="go" id="b_research" onclick="startRun('daily')" title="research the names you added; if fewer than five people are ready, scout for more; put everyone qualified on this page">Run today's work</button>
      </div>
      <div class="row">
        <span class="meta" style="margin:0">or scout by hand:</span>
        <select id="r_kind"></select>
        <input id="r_want" type="number" min="1" max="10" value="3" style="width:70px" title="how many found people to research now">
        <label title="find firms first, then the person to approach at each" style="font-size:13px"><input type="checkbox" id="r_firms" style="width:auto"> by firm</label>
        <button id="b_scout" onclick="startRun('scout')">Scout for this kind</button>
      </div>
      <div id="runlog"></div>
    </div>
  </section>
</main>
<div id="note"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => (s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function note(text) { const n = $("note"); n.textContent = text; n.style.display = "block"; setTimeout(() => n.style.display = "none", 4000); }
// One write at a time: a double click on Close wrote the note twice (2026-09-21).
let writing = false;
async function call(path, body) {
  if (body && writing) throw new Error("a write is still going");
  writing = !!body || writing;
  try {
    const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : undefined);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { note(j.detail || ("failed: " + r.status)); throw new Error(j.detail || r.status); }
    return j;
  } finally { if (body) writing = false; }
}
const words = s => (s || "").trim().split(/\s+/).filter(Boolean).length;

const GIVES = {opinion:"Opinion on the need", objection:"Objection", new_use:"New use", introduction:"Introduction",
               test_case:"Test case offered", meeting:"Meeting", question:"Question", declined:"Declined", other:"Other"};

function exchange(c) {
  // what was sent and what came back, as recorded in Attio, oldest first
  const rows = (c.sent || []).slice().sort((a, b) => a.date < b.date ? -1 : 1)
    .map(n => `<div class="meta" style="margin:8px 0 0">${esc(n.what)}, ${esc(n.date)}</div><div class="said">${esc(n.text)}</div>`).join("");
  return rows ? `<details><summary>What was sent and received</summary>${rows}</details>` : "";
}
function replyBox(i, label) {
  return `<details><summary>${label}</summary>
    <textarea id="reply${i}" placeholder="Paste the reply from ${esc(cards[i].name)}, exactly" style="min-height:90px; margin-top:6px"></textarea>
    <div class="row"><button class="go" onclick="replied(${i})">Record the reply</button></div></details>`;
}
function answerBox(c, i, r, isLast) {
  // the suggested answer to one reply; only the latest reply's answer can be edited and sent
  const a = r.answer;
  if (r.answer_sent) return `<div class="meta">Answered ${esc(r.answer_sent)}.</div>`;
  if (!a || !isLast) return "";
  const text = r.edited_answer || a.message;
  return `<div class="meta" style="margin:10px 0 0">Suggested answer</div>
    ${a.takes_up ? `<div class="why">${esc(a.takes_up)}</div>` : ""}
    ${a.assumes ? `<div class="flag">Check: ${esc(a.assumes)}</div>` : ""}
    ${(a.flags || []).map(f => `<div class="flag">Check: ${esc(f)}</div>`).join("")}
    <textarea class="msg" id="msg${i}" style="min-height:110px" oninput="$('w${i}').textContent = words(this.value) + ' words'">${esc(text)}</textarea>
    <div class="words" id="w${i}">${words(text)} words</div>
    <div class="row">
      <button onclick="copyMsg(${i})">Copy</button>
      <button onclick="saveMsg(${i}, 'answer', '${esc(r.note_id)}')">Save edit</button>
      <button class="go" onclick="answerSent(${i}, '${esc(r.note_id)}')">Answer sent</button>
    </div>`;
}
function closeRow(i, placeholder) {
  return `<input class="grow" id="why${i}" placeholder="${placeholder}"><button class="stop" onclick="skip(${i})">Close</button>`;
}

function card(c, i) {
  const links = [c.linkedin ? `<a href="${esc(c.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>` : "",
                 c.web_url ? `<a href="${esc(c.web_url)}" target="_blank" rel="noopener">Attio</a>` : ""].filter(Boolean).join(" · ");
  const head = `<h3>${esc(c.name)}</h3><div class="meta">${esc([c.title, c.category].filter(Boolean).join(" · "))}${links ? " · " + links : ""}</div>`;
  const why = c.fit_rationale ? `<div class="why">${esc(c.fit_rationale)}</div>` : "";
  const flags = (c.flags || []).map(f => `<div class="flag">Check: ${esc(f)}</div>`).join("");
  const brief = c.brief ? `<details><summary>Brief and evidence</summary><pre class="brief">${esc(c.brief)}</pre></details>` : "";
  const dates = `<div class="meta">Last contact ${esc(c.last_contact || "not recorded")}${c.due ? " · next look " + esc(c.due) : ""}</div>`;

  if (c.group === "ready") return `<div class="card" id="card${i}">${head}${why}${flags}
    <textarea class="msg" id="msg${i}" oninput="$('w${i}').textContent = words(this.value) + ' words'">${esc(c.message)}</textarea>
    <div class="words" id="w${i}">${words(c.message)} words</div>
    <div class="row">
      <button onclick="copyMsg(${i})">Copy</button>
      <button onclick="saveMsg(${i}, 'draft')">Save edit</button>
      <button class="go" onclick="sent(${i})">Sent</button>
      <input class="grow" id="why${i}" placeholder="Reason, if skipping">
      <button class="stop" onclick="skip(${i})">Skip</button>
      <input id="until${i}" type="date" title="put off until">
      <button onclick="later(${i})">Later</button>
    </div>${brief}</div>`;

  if (c.group === "followup") {
    const body = c.followup
      ? `${c.followup_idea ? `<div class="why">${esc(c.followup_idea)}</div>` : ""}${flags}
         <textarea class="msg" id="msg${i}" style="min-height:100px" oninput="$('w${i}').textContent = words(this.value) + ' words'">${esc(c.followup)}</textarea>
         <div class="words" id="w${i}">${words(c.followup)} words</div>`
      : `<div class="flag">No follow-up is drafted yet. "Run today's work" drafts it; or write your own here.</div>
         <textarea class="msg" id="msg${i}" style="min-height:100px"></textarea>`;
    return `<div class="card" id="card${i}">${head}${dates}${body}
      <div class="row">
        <button onclick="copyMsg(${i})">Copy</button>
        ${c.followup ? `<button onclick="saveMsg(${i}, 'followup')">Save edit</button>` : ""}
        <button class="go" onclick="followupSent(${i})">Follow-up sent</button>
        ${closeRow(i, "Reason, if closing without a follow-up")}
        <input id="until${i}" type="date" title="put off until">
        <button onclick="later(${i})">Later</button>
      </div>${replyBox(i, "They replied")}${exchange(c)}${brief}</div>`;
  }

  if (c.group === "noresponse") return `<div class="card" id="card${i}">${head}${dates}
    <div class="row">
      <input class="grow" id="why${i}" value="No response to the first message or to the follow-up.">
      <button class="stop" onclick="skip(${i})">Close</button>
      <input id="until${i}" type="date" title="put off until">
      <button onclick="later(${i})">Later</button>
    </div>${replyBox(i, "They replied")}${exchange(c)}${brief}</div>`;

  if (c.group === "waiting") return `<div class="card" id="card${i}">${head}${dates}${replyBox(i, "They replied")}${exchange(c)}</div>`;

  if (c.group === "replies") {
    const last = (c.replies || []).length - 1;
    const read = (c.replies || []).map((r, k) => `<div class="meta" style="margin:8px 0 0">Reply of ${esc(r.received)}</div>
      <ul class="gives">${(r.gives || []).map(g => `<li><b>${esc(GIVES[g.what] || g.what)}.</b> ${esc(g.note)} <span class="meta">"${esc(g.quote)}"</span></li>`).join("")}</ul>
      ${r.introduced_name ? `<div class="why">Introduces: <b>${esc(r.introduced_name)}</b>. Add them below under "Add a name", with who introduced them.</div>` : ""}
      ${r.next_step ? `<div class="why"><b>Next step:</b> ${esc(r.next_step)}</div>` : ""}
      ${(r.flags || []).map(f => `<div class="flag">Check: ${esc(f)}</div>`).join("")}
      ${answerBox(c, i, r, k === last)}`).join("");
    const pending = (c.sent || []).filter(n => n.what === "Reply").length > (c.replies || []).length
      || (c.replies || []).some(r => !r.answer && (r.gives || []).length);
    const unread = pending
      ? `<div class="flag">A reply is not read yet, or has no suggested answer yet. If no run is going (see Run, below), press Read now.</div>
         <div class="row"><button class="go" onclick="readNow()">Read now</button></div>` : "";
    return `<div class="card" id="card${i}">${head}<div class="meta">${esc(c.stage)} · last contact ${esc(c.last_contact || "not recorded")}</div>
      ${read}${unread}
      <div class="row">
        ${c.stage === "Replied" ? `<button onclick="conversation(${i})" title="the exchange is continuing">Move to Conversation</button>` : ""}
        ${closeRow(i, "Reason, if closing")}
      </div>${replyBox(i, "They replied again")}${exchange(c)}${brief}</div>`;
  }

  return `<div class="card">${head}${why}${flags}${brief}</div>`;
}

let cards = [];
async function load() {
  const q = await call("/api/queue");
  cards = q.cards;
  $("counts").textContent = Object.entries(q.counts).map(([k, v]) => `${k}: ${v}`).join("   ") || "the list is empty";
  // a section about sent messages is hidden while it is empty; the first three kept as they were
  for (const g of ["replies", "followup", "ready", "noresponse", "waiting", "qualified", "research"]) {
    const html = cards.map((c, i) => c.group === g ? card(c, i) : "").join("");
    $(g).innerHTML = html || `<div class="meta">Nobody.</div>`;
    $(g).parentElement.classList.toggle("empty", !html && !["ready", "qualified", "research"].includes(g));
  }
  if (!$("r_kind").options.length) $("r_kind").innerHTML = q.kinds.map(k => `<option>${esc(k)}</option>`).join("");
}
async function copyMsg(i) { await navigator.clipboard.writeText($("msg" + i).value); note("Copied. Paste it into LinkedIn, then press Sent."); }
async function saveMsg(i, which, note_id) { await call("/api/edit", {name: cards[i].name, message: $("msg" + i).value, which, note_id: note_id || ""}); note("Edit saved."); }
async function answerSent(i, note_id) {
  const message = $("msg" + i).value.trim();
  if (!message) { note("There is no answer text to record."); return; }
  if (!confirm(`Record that this answer was sent to ${cards[i].name}?`)) return;
  await call("/api/answer_sent", {record_id: cards[i].record_id, name: cards[i].name, note_id, message});
  note("Recorded as sent."); load();
}
async function readNow() { await call("/api/run", {what: "replies"}); note("Reading. The card fills in when it ends."); poll(); }
async function followupSent(i) {
  const message = $("msg" + i).value.trim();
  if (!message) { note("There is no follow-up text to record."); return; }
  if (!confirm(`Record that this follow-up was sent to ${cards[i].name}?`)) return;
  await call("/api/followup_sent", {record_id: cards[i].record_id, name: cards[i].name, message});
  note("Recorded as sent."); load();
}
async function replied(i) {
  const reply = $("reply" + i).value.trim();
  if (!reply) { note("Paste the reply first."); return; }
  if (!confirm(`Record this as a reply from ${cards[i].name}?`)) return;
  const r = await call("/api/replied", {record_id: cards[i].record_id, reply});
  note(r.reading ? "Recorded. The reply is being read; the card fills in when that ends." : "Recorded. A run is going; the reply is read by the next run.");
  load(); poll();
}
async function conversation(i) { await call("/api/conversation", {record_id: cards[i].record_id}); note("Moved to Conversation."); load(); }
async function sent(i) {
  if (!confirm(`Record that this message was sent to ${cards[i].name}?`)) return;
  await call("/api/sent", {record_id: cards[i].record_id, name: cards[i].name, message: $("msg" + i).value});
  note("Recorded as sent."); load();
}
async function skip(i) {
  const reason = $("why" + i).value.trim();
  if (!reason) { note("Give a reason; it is the record of why."); return; }
  await call("/api/skip", {record_id: cards[i].record_id, reason}); note("Skipped."); load();
}
async function later(i) {
  const until = $("until" + i).value;
  if (!until) { note("Choose a date."); return; }
  await call("/api/later", {record_id: cards[i].record_id, until}); note("Put off until " + until + "."); load();
}
async function addName() {
  await call("/api/add", {name: $("a_name").value, title: $("a_title").value, linkedin: $("a_linkedin").value,
                          how_known: $("a_how").value, pasted: $("a_pasted").value, pasted_source: $("a_source").value});
  ["a_name", "a_title", "a_linkedin", "a_how", "a_pasted", "a_source"].forEach(id => $(id).value = "");
  note("Added. The next research run will work on them."); load();
}
async function startRun(what) {
  await call("/api/run", {what, kind: $("r_kind").value, want: parseInt($("r_want").value || "3", 10),
                         firms: $("r_firms").checked});
  poll();
}
let wasRunning = false;
async function poll() {
  const s = await call("/api/run");
  $("b_research").disabled = $("b_scout").disabled = s.running;
  $("runlog").textContent = (s.what ? `${s.running ? "Running" : "Last run"}: ${s.what}, started ${s.started}${s.exit === null || s.exit === undefined ? "" : ", exit " + s.exit}\n` : "") + s.log.join("\n");
  if (wasRunning && !s.running) load();
  wasRunning = s.running;
  if (s.running) setTimeout(poll, 5000);
}
load(); poll();
</script>
</body>
</html>
