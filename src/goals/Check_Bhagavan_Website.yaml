name: "Check Bhagavan Website"
description: "Fetch bhagavan.tuuyi.com and verify it is returning valid content."

test_goal: >
  goal: Fetch https://bhagavan.tuuyi.com using fetch-text. The tool returns extracted
  plain text (HTML tags are stripped by design — do NOT check for HTML tags in the
  result). Return True if the fetch succeeds and the extracted text is non-empty
  (at least 50 characters). Return False if the fetch fails or the extracted text
  is empty or very short (under 50 characters). Do not apply any HTML-structure
  checks. Report only True or False.
