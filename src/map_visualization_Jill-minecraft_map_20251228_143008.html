<!DOCTYPE html>
<html>
<head>
    <title>Map Visualization - Jill-minecraft_map</title>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
        }
        .header {
            background: #252526;
            padding: 15px 20px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            font-size: 20px;
            font-weight: 500;
            color: #cccccc;
        }
        .stats {
            font-size: 14px;
            color: #888;
        }
        .controls {
            background: #252526;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
        }
        button:hover { background: #1177bb; }
        button:active { background: #0d5585; }
        .container {
            display: flex;
            gap: 20px;
        }
        .map-area {
            flex: 1;
            background: #252526;
            border-radius: 4px;
            padding: 20px;
            position: relative;
        }
        canvas {
            border: 1px solid #3e3e42;
            border-radius: 4px;
            background: #1e1e1e;
            cursor: crosshair;
        }
        .sidebar {
            width: 300px;
            background: #252526;
            border-radius: 4px;
            padding: 15px;
            max-height: 800px;
            overflow-y: auto;
        }
        .section {
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }
        .waypoint-item {
            padding: 6px 10px;
            margin: 4px 0;
            background: #2a2d2e;
            border-radius: 3px;
            font-size: 13px;
            cursor: pointer;
        }
        .waypoint-item:hover {
            background: #3a3d3e;
        }
        .location-item {
            padding: 6px 10px;
            margin: 4px 0;
            background: #2a2d2e;
            border-radius: 3px;
            font-size: 12px;
            font-family: 'Consolas', monospace;
        }
        .info-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(30, 30, 30, 0.9);
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            display: none;
            border: 1px solid #3e3e42;
        }
        .info-panel.visible {
            display: block;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e1e1e; }
        ::-webkit-scrollbar-thumb { background: #424242; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4e4e4e; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🗺️ Map Visualization: Jill-minecraft_map</h1>
        <div class="stats">
            1 locations • 0 waypoints
        </div>
    </div>
    
    <div class="controls">
        <button onclick="resetView()">Reset View</button>
        <button onclick="fitToBounds()">Fit All</button>
        <button onclick="toggleWaypoints()">Toggle Waypoints</button>
        <button onclick="exportData()">Export JSON</button>
    </div>
    
    <div class="container">
        <div class="map-area">
            <canvas id="mapCanvas" width="800" height="600"></canvas>
            <div id="infoPanel" class="info-panel"></div>
        </div>
        
        <div class="sidebar">
            <div class="section">
                <div class="section-title">Waypoints (0)</div>
                <div id="waypointsList">

                </div>
            </div>
            
            <div class="section">
                <div class="section-title">Recent Locations</div>
                <div id="locationsList">

                    <div class="location-item" onclick="focusLocation(-112, -115)">
                        (-112, 71, -115)<br>
                        <span style="color: #888; font-size: 11px;">
                            Visits: 1
                            
                        </span>
                    </div>

                </div>
            </div>
        </div>
    </div>
    
    <script>
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const infoPanel = document.getElementById('infoPanel');
        
        // Map data
        const locations = [{"x": -112, "y": 71, "z": -115, "visit_count": 1, "waypoints": [], "first_visit": "2025-12-28T14:28:38.472794", "last_visit": "2025-12-28T14:28:38.472794"}];
        const waypoints = [];
        const bounds = {
            minX: -112,
            maxX: -112,
            minZ: -115,
            maxZ: -115,
            rangeX: 1,
            rangeZ: 1
        };
        
        // View state
        let scale = 1;
        let offsetX = 0;
        let offsetZ = 0;
        let showWaypoints = true;
        let isDragging = false;
        let dragStart = {x: 0, z: 0};
        
        // Convert world coordinates to canvas coordinates
        function worldToCanvas(x, z) {
            const canvasX = ((x - bounds.minX) / bounds.rangeX) * canvas.width * scale + offsetX;
            const canvasZ = ((z - bounds.minZ) / bounds.rangeZ) * canvas.height * scale + offsetZ;
            return {x: canvasX, z: canvasZ};
        }
        
        // Convert canvas coordinates to world coordinates
        function canvasToWorld(canvasX, canvasZ) {
            const worldX = ((canvasX - offsetX) / scale) * bounds.rangeX / canvas.width + bounds.minX;
            const worldZ = ((canvasZ - offsetZ) / scale) * bounds.rangeZ / canvas.height + bounds.minZ;
            return {x: worldX, z: worldZ};
        }
        
        // Draw map
        function drawMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid
            ctx.strokeStyle = '#2a2d2e';
            ctx.lineWidth = 1;
            const gridSpacing = 50 * scale;
            for (let x = -offsetX % gridSpacing; x < canvas.width; x += gridSpacing) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let z = -offsetZ % gridSpacing; z < canvas.height; z += gridSpacing) {
                ctx.beginPath();
                ctx.moveTo(0, z);
                ctx.lineTo(canvas.width, z);
                ctx.stroke();
            }
            
            // Draw locations
            locations.forEach(loc => {
                const pos = worldToCanvas(loc.x, loc.z);
                const radius = Math.max(3, Math.min(8, 3 + loc.visit_count * 0.5));
                
                // Color based on visit count
                const intensity = Math.min(255, 100 + loc.visit_count * 30);
                ctx.fillStyle = `rgb(${intensity}, 150, 100)`;
                ctx.beginPath();
                ctx.arc(pos.x, pos.z, radius, 0, Math.PI * 2);
                ctx.fill();
                
                // Border
                ctx.strokeStyle = '#4ec9b0';
                ctx.lineWidth = 1;
                ctx.stroke();
            });
            
            // Draw waypoints
            if (showWaypoints) {
                waypoints.forEach(wp => {
                    const pos = worldToCanvas(wp.x, wp.z);
                    ctx.fillStyle = '#ffd700';
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.z, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#ffaa00';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    
                    // Label
                    ctx.fillStyle = '#ffd700';
                    ctx.font = '12px sans-serif';
                    ctx.fillText(wp.name, pos.x + 8, pos.z - 8);
                });
            }
        }
        
        // Mouse events
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            dragStart.x = e.offsetX;
            dragStart.z = e.offsetY;
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                offsetX += e.offsetX - dragStart.x;
                offsetZ += e.offsetY - dragStart.z;
                dragStart.x = e.offsetX;
                dragStart.z = e.offsetY;
                drawMap();
            } else {
                // Show info panel
                const worldPos = canvasToWorld(e.offsetX, e.offsetY);
                const nearby = locations.filter(loc => 
                    Math.abs(loc.x - worldPos.x) < 1 && Math.abs(loc.z - worldPos.z) < 1
                );
                if (nearby.length > 0) {
                    const loc = nearby[0];
                    infoPanel.innerHTML = `
                        <strong>Location</strong><br>
                        X: ${loc.x}, Y: ${loc.y}, Z: ${loc.z}<br>
                        Visits: ${loc.visit_count}<br>
                        ${loc.waypoints.length > 0 ? 'Waypoints: ' + loc.waypoints.join(', ') : ''}
                    `;
                    infoPanel.classList.add('visible');
                } else {
                    infoPanel.classList.remove('visible');
                }
            }
        });
        
        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });
        
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            scale *= delta;
            scale = Math.max(0.1, Math.min(5, scale));
            drawMap();
        });
        
        // Control functions
        function resetView() {
            scale = 1;
            offsetX = 0;
            offsetZ = 0;
            drawMap();
        }
        
        function fitToBounds() {
            const padding = 20;
            const scaleX = (canvas.width - padding * 2) / canvas.width;
            const scaleZ = (canvas.height - padding * 2) / canvas.height;
            scale = Math.min(scaleX, scaleZ);
            offsetX = padding;
            offsetZ = padding;
            drawMap();
        }
        
        function toggleWaypoints() {
            showWaypoints = !showWaypoints;
            drawMap();
        }
        
        function focusLocation(x, z) {
            const pos = worldToCanvas(x, z);
            offsetX = canvas.width / 2 - pos.x;
            offsetZ = canvas.height / 2 - pos.z;
            scale = 2;
            drawMap();
        }
        
        function exportData() {
            const data = {
                map_name: 'Jill-minecraft_map',
                locations: locations,
                waypoints: waypoints,
                bounds: bounds,
                exported_at: new Date().toISOString()
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Jill-minecraft_map_export.json';
            a.click();
            URL.revokeObjectURL(url);
        }
        
        // Initial draw
        fitToBounds();
    </script>
</body>
</html>
