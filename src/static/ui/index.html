<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infospace — Cognitive Workbench</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <link rel="stylesheet" href="/static/ui/css/activation-field.css?v=2">
    <link rel="icon" href="/static/favicon.png" type="image/png">
</head>
<body>
    <!-- Main canvas: D3 force-directed graph -->
    <svg id="activation-field"></svg>

    <!-- OODA pulse overlay (canvas for smooth animation) -->
    <canvas id="pulse-canvas"></canvas>

    <!-- Inspector panel (slides in from right) -->
    <div id="inspector" class="inspector hidden">
        <div class="inspector-header">
            <span id="inspector-title"></span>
            <button id="inspector-close" class="btn-icon" title="Close">&times;</button>
        </div>
        <div id="inspector-content" class="inspector-body"></div>
        <div id="inspector-actions" class="inspector-actions"></div>
    </div>

    <!-- Bottom dock -->
    <div id="dock">
        <div class="dock-section dock-chat">
            <button id="dock-chat-toggle" class="dock-btn" title="Chat">Chat</button>
        </div>
        <div class="dock-section dock-goal">
            <button id="dock-goal-toggle" class="dock-btn" title="New Goal">+ Goal</button>
        </div>
        <div class="dock-section dock-status">
            <span id="dock-status-text" class="dock-status-text">Connecting...</span>
            <span id="dock-health" class="dock-health" title="System health"></span>
            <span id="dock-footprint" class="dock-health" title="Resource footprint"></span>
        </div>
        <div class="dock-section dock-controls">
            <button id="btn-stop" class="dock-btn" title="Stop">Stop</button>
            <button id="btn-continuous" class="dock-btn" title="Toggle continuous">Continuous</button>
            <button id="btn-llm" class="dock-btn" title="Toggle LLM">LLM</button>
        </div>
        <div class="dock-section dock-system">
            <a href="http://localhost:3001" target="_blank" class="dock-btn" title="Resource Browser">Resources</a>
            <a href="http://localhost:3002" target="_blank" class="dock-btn" title="Task & Concern Manager">Tasks</a>
            <a href="/classic" target="_blank" class="dock-btn" title="Classic UI">Classic</a>
            <button id="btn-save" class="dock-btn" title="Save">Save</button>
            <button id="btn-shutdown" class="dock-btn dock-btn-danger" title="Shutdown">Shutdown</button>
        </div>
    </div>

    <!-- Chat overlay (slides up from dock) -->
    <div id="chat-panel" class="slide-panel hidden">
        <div class="slide-panel-header">
            <span>Chat</span>
            <button class="btn-icon slide-panel-close" data-target="chat-panel">&times;</button>
        </div>
        <div id="chat-messages" class="chat-messages"></div>
        <div class="chat-input-row">
            <textarea id="chat-input" placeholder="Message Jill..." rows="1"></textarea>
            <button id="chat-send" class="dock-btn">Send</button>
            <button id="chat-end" class="dock-btn chat-end-btn" title="End conversation">End</button>
        </div>
    </div>

    <!-- Goal entry overlay (slides up from dock) -->
    <div id="goal-panel" class="slide-panel hidden">
        <div class="slide-panel-header">
            <span>New Goal</span>
            <button class="btn-icon slide-panel-close" data-target="goal-panel">&times;</button>
        </div>
        <div class="goal-entry">
            <textarea id="goal-input" placeholder="Enter goal text..." rows="3"></textarea>
            <div class="goal-options">
                <label>
                    <input type="checkbox" id="goal-schedule" checked> Schedule (auto-proceed)
                </label>
                <select id="goal-mode">
                    <option value="auto">Auto</option>
                    <option value="manual">Manual</option>
                    <option value="daily">Daily</option>
                </select>
            </div>
            <button id="goal-submit" class="dock-btn dock-btn-primary">Submit Goal</button>
        </div>
    </div>

    <!-- Confirmation dialog -->
    <div id="confirm-dialog" class="confirm-overlay hidden">
        <div class="confirm-box">
            <p id="confirm-message"></p>
            <div class="confirm-buttons">
                <button id="confirm-yes" class="dock-btn dock-btn-danger">Yes</button>
                <button id="confirm-no" class="dock-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script type="module" src="/static/ui/js/main.js"></script>
</body>
</html>
