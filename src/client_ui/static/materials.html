<main class="site one">

      <span class="crumbs" id="crumbs"></span>

    <table class="files" id="files"></table>

      <h2>What the review reads</h2>
      <p class="muted">Claim sources are the documents whose assertions are listed and tested; they are not evidence. Excluded paths may be listed by the review but not read or cited. Both can be changed at any time; a job reads them when it starts.</p>
      <div class="mono" id="markLists"></div>
    </div>
