<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Restrict embedded HTML to no remote network calls (model-controlled
     content shouldn't fetch arbitrary URLs). Inline scripts are allowed
     so model-supplied <script> tags inside an HTML payload still run.
     Tighten this further if you want a stricter sandbox.

     Images are allowed only via data:/blob: or the local proxy
     (http://127.0.0.1:*) — direct remote URLs stay blocked, so model-
     authored <img src="https://..."> won't bypass the proxy's SSRF
     guard or its size/cache bounds. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline' data: blob:;
               img-src 'self' data: blob: http://127.0.0.1:*;
               script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
               style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
               connect-src ws://127.0.0.1:* http://127.0.0.1:*;">
<title>Jill — canvas</title>
<style>
  html, body { margin: 0; padding: 0;
               background: #111; color: #ddd;
               font-family: -apple-system, system-ui, sans-serif;
               line-height: 1.55; }
  #content { padding: 28px 36px; max-width: 980px; margin: 0 auto; }
  #content h1, #content h2, #content h3 { color: #fff;
               border-bottom: 1px solid #333; padding-bottom: 4px; }
  #content code { background: #1d1d1d; padding: 1px 5px; border-radius: 3px;
               font-family: 'JetBrains Mono', 'Courier New', monospace; }
  #content pre  { background: #161616; padding: 12px; border-radius: 5px;
               overflow-x: auto;
               font-family: 'JetBrains Mono', 'Courier New', monospace; }
  #content pre code { background: transparent; padding: 0; }
  #content blockquote { border-left: 3px solid #444; margin: 0;
               padding: 0 14px; color: #aaa; }
  #content table { border-collapse: collapse; }
  #content th, #content td { border: 1px solid #333; padding: 6px 10px; }
  #content th { background: #1d1d1d; }
  #content a { color: #6ea0ff; }
  #content img, #content svg { max-width: 100%; height: auto; }
  #status { position: fixed; left: 8px; bottom: 6px; font-size: 10px;
            color: rgba(255,255,255,0.4); pointer-events: none; }
  #pager { position: fixed; right: 10px; bottom: 6px; font-size: 12px;
           color: rgba(255,255,255,0.55); user-select: none;
           background: rgba(17,17,17,0.8); padding: 2px 8px;
           border-radius: 10px; }
  #pager .pager-btn { cursor: pointer; padding: 0 4px; }
  #pager .pager-btn.disabled { opacity: 0.25; cursor: default; }
  #pager #pager-live { color: #6ea0ff; cursor: pointer; margin-left: 6px;
                       font-weight: 600; }
</style>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<!-- <model-viewer> web component: pulls in once, then any payload's
     <model-viewer src="..."> tag renders with mouse orbit controls.
     Lives at the page level (not in payloads) so the cost is paid once
     per chromium spawn rather than per display() call. Zero runtime
     cost when no <model-viewer> tag is in the DOM. -->
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
</head>
<body>
<div id="content"><p style="color:#777">canvas idle — waiting for Jill to push content…</p></div>
<div id="status">connecting…</div>
<div id="pager" hidden>
  <span id="pager-prev" class="pager-btn">‹</span>
  <span id="pager-info"></span>
  <span id="pager-next" class="pager-btn">›</span>
  <span id="pager-live" hidden>LIVE</span>
</div>
<script>
'use strict';

const WS_URL = `ws://${location.hostname || '127.0.0.1'}:${
  new URLSearchParams(location.search).get('ws_port') || '8788'}`;
const contentEl = document.getElementById('content');
const statusEl = document.getElementById('status');
const pagerEl = document.getElementById('pager');
const pagerPrevEl = document.getElementById('pager-prev');
const pagerInfoEl = document.getElementById('pager-info');
const pagerNextEl = document.getElementById('pager-next');
const pagerLiveEl = document.getElementById('pager-live');

// Scrollback: one entry per ReAct turn (the bridge replays recent ones on
// connect). Same-turn publishes are drafts — they replace the tail entry,
// so scrollback holds each turn's final render. Paging back pins the view;
// new entries then only bump the counter until LIVE (or ›) returns to the
// latest.
const HISTORY_MAX = 50;   // keep in step with _HISTORY_MAX in the bridge
const entries = [];       // {content, format, ts, seq, turn, key}
let viewIdx = -1;

function onPayload(payload) {
  let obj;
  try {
    obj = JSON.parse(payload);
  } catch (e) {
    console.warn('parse failed', e);
    contentEl.innerHTML =
      `<pre style="color:#f88">canvas: parse error — ${escapeHtml(String(e))}</pre>`;
    return;
  }
  if (!obj.seq) return;  // idle '{}' placeholder — nothing published yet
  const key = `${obj.seq}:${obj.ts}`;
  if (entries.some(en => en.key === key)) return;  // reconnect replay dup
  const wasLive = viewIdx === entries.length - 1;  // true when empty too
  const entry = { content: obj.content || '', format: obj.format || 'markdown',
                  ts: obj.ts || 0, seq: obj.seq, turn: obj.turn || 0, key };
  if (entry.turn && entries.length
      && entries[entries.length - 1].turn === entry.turn) {
    entries[entries.length - 1] = entry;  // same-turn draft → replace keyframe
    if (wasLive) show(entries.length - 1); else updatePager();
    return;
  }
  entries.push(entry);
  if (entries.length > HISTORY_MAX) {
    entries.shift();
    if (viewIdx > 0) viewIdx -= 1;
  }
  if (wasLive) show(entries.length - 1);
  else updatePager();
}

function show(idx) {
  viewIdx = idx;
  const en = entries[idx];
  let body = '';
  try {
    if (en.format === 'html') {
      body = en.content;
    } else {
      // marked.js renders markdown → HTML with sensible defaults.
      // GFM tables, fenced code, autolinks all on by default in v11+.
      body = (window.marked && marked.parse) ? marked.parse(en.content)
                                             : escapeHtml(en.content);
    }
  } catch (e) {
    console.warn('render failed', e);
    body = `<pre style="color:#f88">canvas: render error — ${escapeHtml(String(e))}</pre>`;
  }
  contentEl.innerHTML = body;
  updatePager();
}

function updatePager() {
  if (!entries.length) { pagerEl.hidden = true; return; }
  pagerEl.hidden = false;
  const t = new Date(entries[viewIdx].ts * 1000);
  const hhmm = `${String(t.getHours()).padStart(2, '0')}:${
    String(t.getMinutes()).padStart(2, '0')}`;
  pagerInfoEl.textContent = `${viewIdx + 1}/${entries.length} · ${hhmm}`;
  pagerPrevEl.classList.toggle('disabled', viewIdx === 0);
  pagerNextEl.classList.toggle('disabled', viewIdx === entries.length - 1);
  pagerLiveEl.hidden = viewIdx === entries.length - 1;
}

function nav(delta) {
  const i = viewIdx + delta;
  if (i >= 0 && i < entries.length) show(i);
}

document.addEventListener('keydown', (ev) => {
  if (ev.key === 'ArrowLeft') nav(-1);
  else if (ev.key === 'ArrowRight') nav(1);
});
pagerPrevEl.onclick = () => nav(-1);
pagerNextEl.onclick = () => nav(1);
pagerLiveEl.onclick = () => show(entries.length - 1);

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

function connect() {
  statusEl.textContent = 'connecting…';
  const ws = new WebSocket(WS_URL);
  ws.onopen  = () => { statusEl.textContent = ''; };
  ws.onclose = () => {
    statusEl.textContent = 'disconnected — retrying';
    setTimeout(connect, 1500);
  };
  ws.onerror = () => { statusEl.textContent = 'ws error'; };
  ws.onmessage = (ev) => onPayload(ev.data);
}
connect();
</script>
</body>
</html>
